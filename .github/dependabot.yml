# Keeps the SHA-pinned actions in .github/workflows/ from going stale.
#
# Pinning to a commit is what stops a compromised or re-pointed tag executing
# in CI, but it also freezes the action at that commit forever — including its
# security fixes. Pinning without this file trades one risk for another.
# Dependabot opens a PR when a pinned action moves, rewriting the SHA and the
# trailing "# v4" comment together.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  # The Dockerfiles pin their base images by digest, which makes a rebuild of
  # one commit reproducible and also freezes the base's security patches. This
  # is the other half: a PR whenever python:3.11-slim, node:22-slim or
  # nginx:stable-alpine moves, which images.yml then builds, scans and
  # smoke-tests like any other change.
  - package-ecosystem: "docker"
    directories:
      - "/Backend"
      - "/Frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "docker"
