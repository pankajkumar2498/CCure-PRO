# Proxy settings shared by every location that forwards to the core API.
# Included by gateway.conf in the authenticated path (location /api/) and the
# unauthenticated one (@ccure_noauth), so the two cannot drift.
#
# Nothing here adds a response header: the application's own headers pass
# through untouched, and a header the gateway emitted as well would appear
# twice (the add_header-inheritance trap recorded in CLAUDE.md).

# /api/<path> -> <path>, exactly as host nginx strips the prefix today. A named
# location cannot carry a URI in proxy_pass, so both paths rewrite instead.
rewrite ^/api(/.*)$ $1 break;
proxy_pass http://ccure_api;
proxy_http_version 1.1;

# ── identity: never taken from the client ────────────────────────────────────
# Every header an upstream could mistake for an asserted identity is cleared
# (an empty value removes it), then the verified principal from gateway-auth
# is set. On the unauthenticated path those variables are empty, so the
# headers are simply absent. No production code reads them yet (10.2 design
# §9); they exist for correlation, and the core re-verifies the token itself.
proxy_set_header X-Tenant-ID            "";
proxy_set_header X-Tenant               "";
proxy_set_header X-Org                  "";
proxy_set_header X-Org-ID               "";
proxy_set_header X-Organization-ID      "";
proxy_set_header X-User                 "";
proxy_set_header X-User-ID              "";
proxy_set_header X-User-Email           "";
proxy_set_header X-User-Role            "";
proxy_set_header X-Auth-User            "";
proxy_set_header X-Auth-Request-User    "";
proxy_set_header X-Auth-Request-Email   "";
proxy_set_header X-Forwarded-User       "";
proxy_set_header X-Forwarded-Email      "";
proxy_set_header X-Remote-User          "";
proxy_set_header Remote-User            "";
proxy_set_header X-Ccure-Policy         "";
proxy_set_header X-Ccure-Method         "";
proxy_set_header X-Ccure-Args           "";
proxy_set_header X-Ccure-Refusal        "";
proxy_set_header X-Ccure-Auth-Sub       $ccure_auth_sub;
proxy_set_header X-Ccure-Auth-Jti       $ccure_auth_jti;
proxy_set_header X-Ccure-Auth-Ptype     $ccure_auth_ptype;
proxy_set_header X-Ccure-Auth-Kind      $ccure_auth_kind;

# ── the client, as the trust boundary resolved it ────────────────────────────
# $remote_addr is the real client once realip has accepted X-Real-IP from a
# trusted edge (trust/*.conf), and the socket peer otherwise. Both headers are
# SET, never appended: an appended X-Forwarded-For would let the client's own
# leftmost entry through (finding F10-1).
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $ccure_forwarded_proto;
proxy_set_header Host              $host;

# ── WebSocket upgrade ────────────────────────────────────────────────────────
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $ccure_connection_upgrade;

# ── streaming: SSE, downloads, uploads ───────────────────────────────────────
# Nothing is buffered to disk in either direction: report downloads and
# evidence uploads must never land in a temp directory an indexer or a backup
# could reach. Timeouts match host nginx (3600 s), far above the 25 s
# notification heartbeat.
proxy_buffering           off;
proxy_request_buffering   off;
proxy_max_temp_file_size  0;
proxy_cache               off;
proxy_read_timeout        3600s;
proxy_send_timeout        3600s;
