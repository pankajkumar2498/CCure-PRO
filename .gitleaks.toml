# gitleaks configuration for CCure-Audit-PRO.
#
# The default rules catch high-entropy values — they do flag the JWT signing
# key that was committed in .env.example. They do NOT flag the Gmail app
# password that was committed beside it: sixteen lowercase letters carries
# too little entropy to look like a secret, and it was a live send-as
# credential for a real account.
#
# So the default set is kept and one rule is added for the specific shape
# both leaks had: a real value assigned to a secret-named variable inside a
# committed .example file. Those files exist to be read by strangers, which
# is precisely why nothing real may sit in one.

[extend]
useDefault = true

[[rules]]
id = "env-example-real-secret"
description = "Non-placeholder secret assigned in a committed .example env file"
# Key must END in the secret word, so ACCESS_TOKEN_EXPIRES_MINUTES=30 and
# REFRESH_COOKIE_NAME=... do not match. Value must be 8+ characters, so an
# intentionally empty assignment does not match either.
#
# Horizontal whitespace only around the '=': \s also matches a newline, so an
# empty DEFAULT_ADMIN_PASSWORD= consumed the line break and matched the next
# line's value, reporting a leak on a deliberately blank assignment.
regex = '''(?mi)^[A-Z0-9_]*(?:PASSWORD|SECRET|TOKEN|API_KEY|_KEY)[ \t]*=[ \t]*(\S{8,})[ \t]*$'''
path = '''\.example$'''

[rules.allowlist]
regexTarget = "match"
regexes = [
  '''(?i)(change_me|generate_me|your_|placeholder|example\.com|dummy|xxxx|<[^>]+>)''',
]

# Global allowlist for two false positives the default rules raise on this
# codebase, matched against the flagged text rather than the whole line.
#
# 1. The UX4G asset scripts and the design-system tests build the path
#    tokens/ux4g.generated.css one segment per argument. The word
#    "tokens" followed by a quoted string trips generic-api-key; the
#    "secret" is a stylesheet filename.
# 2. Register.test.jsx drives the password-strength validator with fixed
#    literals, one per rule it must reject. They are test vectors, not
#    credentials, and the test needs them spelled out.
# 3. .gitleaksignore itself. Each line is a 40-hex commit id beside a rule
#    name, which generic-api-key reads as a key assignment, so the file that
#    records reviewed findings was reported as a leak on the commit adding it.
#    Excluded by exact path; it holds fingerprints, never values.
[allowlist]
regexTarget = "match"
regexes = [
  '''ux4g\.generated\.(css|manifest\.json)''',
  '''Str0ngPassphrase1''',
]
paths = [
  '''^\.gitleaksignore$''',
]
