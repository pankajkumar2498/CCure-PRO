# Site settings for the LIVE gateway (Phase 10.5, docker-compose.yml service
# `api-gateway`). Mounted as /etc/nginx/ccure/site.conf.
#
# Every address here is a static assignment on the compose network `gateway`
# (docker-compose.yml, 172.31.254.0/24, internal: no route off the host):
#
#   172.31.254.1   the bridge itself — host nginx's address when it connects
#                  to the gateway (it dials 172.31.254.10:8080 directly; no
#                  port is published, so there is no docker-proxy hop)
#   172.31.254.10  api-gateway (this nginx)
#   172.31.254.11  gateway-auth
#   172.31.254.20  api
#
# Literal addresses rather than service names: nginx resolves an upstream name
# once, at start, and refuses to start if it cannot — so a gateway restarted
# while the api is being recreated would stay down. The addresses are fixed by
# the network's IPAM, and gateway/production/tests pins them to the compose
# file so the two cannot drift.

upstream ccure_api {
    server 172.31.254.20:8000;
}
upstream ccure_gateway_auth {
    server 172.31.254.11:8080;
}

# ── trust boundary ───────────────────────────────────────────────────────────
# Exactly one peer may assert the client address and scheme: host nginx, which
# arrives as the bridge address. Any other peer's X-Real-IP / X-Forwarded-For /
# X-Forwarded-Proto is ignored and its own socket address is forwarded
# (proxy_api.conf SETS both headers, never appends).
set_real_ip_from 172.31.254.1;

geo $realip_remote_addr $ccure_from_edge {
    default       0;
    172.31.254.1  1;
}
