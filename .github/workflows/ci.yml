name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ccure_test
          POSTGRES_USER: ccure_user
          POSTGRES_PASSWORD: ccure_admin_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt
          pip install pytest pytest-cov pytest-rerunfailures bandit ruff

      - name: Run Static Security Analysis (Bandit)
        run: |
          bandit -r Backend/ -ll -x Backend/tests

      - name: Run Linting Checks (Ruff)
        run: |
          ruff check Backend/

      - name: Run Alembic Migration Integrity Check
        env:
          DATABASE_URL: postgresql://ccure_user:ccure_admin_2026@localhost:5432/ccure_test
        run: |
          cd Backend
          # Run forward migration
          alembic upgrade head
          # Run rollback check
          alembic downgrade -1
          # Re-apply migrations for subsequent seed scripts and tests
          alembic upgrade head

      - name: Run Database Seeding Validation
        env:
          DATABASE_URL: postgresql://ccure_user:ccure_admin_2026@localhost:5432/ccure_test
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          JWT_SECRET_KEY: test_secret_key_32_chars_minimum_value
        run: |
          cd Backend
          python db/migrate_production_schema.py
          python -m scripts.seed_compliance
          python -m scripts.seed_real_rules

      - name: OpenAPI Schema Diff Check
        env:
          DATABASE_URL: postgresql://ccure_user:ccure_admin_2026@localhost:5432/ccure_test
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          JWT_SECRET_KEY: test_secret_key_32_chars_minimum_value
        run: |
          cd Backend
          # Extract current schema
          python -c "import json; from main import app; print(json.dumps(app.openapi()))" > openapi_new.json
          # Check against baseline schema if it exists
          if [ -f "openapi.json" ]; then
            echo "Comparing current schema to tracked baseline..."
            diff -u openapi.json openapi_new.json || (echo "Error: Breaking OpenAPI changes detected!" && exit 1)
          else
            echo "No baseline openapi.json found. Saving current schema as baseline for local checks."
            cp openapi_new.json openapi.json
          fi

      - name: Run Test Suite (with mock profile fallbacks)
        env:
          DATABASE_URL: postgresql://ccure_user:ccure_admin_2026@localhost:5432/ccure_test
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          JWT_SECRET_KEY: test_secret_key_32_chars_minimum_value
          MOCK_SCANNERS: "true"
        run: |
          cd Backend
          pytest --cov=. --cov-report=xml -v --reruns 1

  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd Frontend
          npm ci

      - name: Run Vulnerability Audit (NPM Audit)
        run: |
          cd Frontend
          npm audit --audit-level=high

      - name: Run Code Formatting and Linting Checks
        run: |
          cd Frontend
          npm run lint || echo "Lint warnings found"
