name: Images

# Source -> Docker build -> security scan -> immutable SHA-tagged image ->
# smoke test. Nothing is pushed anywhere: publishing to a registry is the next
# phase, and it will push the image this workflow built and verified, never a
# rebuild. Policy and procedure: docs/ci/CONTAINER_IMAGES.md.
#
# Not a pull-request check. A PR is gated on what it changes in the application
# (ci.yml, security.yml); this scans what the image carries besides: Debian and
# Alpine packages and the scanner binaries, whose advisories arrive with no
# commit at all. Gating PRs on it turned them red for advisories nobody had
# introduced. It runs after a merge to master, nightly, and on demand.
# docs/ci/BRANCH_PROTECTION.md lists which checks are required, and these are
# deliberately not among them: a required check that never runs on a PR would
# leave every PR waiting for it.
on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 21 * * *'   # 02:30 IST
  workflow_dispatch:

# Read-only token; no job references a secret. The layer cache below talks to
# the Actions cache service through the runner's own token, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_NODE_TYPE: node24
  # Trivy 0.74.0 by digest, run as a container like gitleaks in security.yml.
  TRIVY_IMAGE: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  image:
    name: ${{ matrix.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: Backend Image
            name: ccure-audit-pro-backend
            context: Backend
            file: Backend/Dockerfile
            smoke: scripts/ci/smoke_backend.sh
            exceptions: .github/security/trivy-backend.yaml
            # Python packages are pip-audit's (security.yml), with their own
            # reviewed backlog. Gating them here too would put one advisory
            # under two exception lists that drift apart. Everything else in
            # the image — Debian packages, the Go scanner binaries, the base
            # image's own Python tooling — is this gate's.
            skip: --skip-dirs /home/ccure/.local/lib/python3.11/site-packages
          - title: Frontend Image
            name: ccure-audit-pro-frontend
            context: Frontend
            file: Frontend/Dockerfile
            smoke: scripts/ci/smoke_frontend.sh
            exceptions: .github/security/trivy-frontend.yaml
            skip: ''
          # The gateway's token check, which answers for every API request.
          # Built from the repository root: its Dockerfile copies the core's
          # verification rules, and Dockerfile.dockerignore beside it is an
          # allow-list of exactly those files. Nothing is skipped: pip-audit
          # (security.yml) audits only Backend/requirements.txt, so Trivy is
          # the gate for this image's Python packages too. They are pinned to
          # the core's versions, and trivy-gateway-auth.yaml repeats only the
          # core's existing decisions on them.
          - title: Gateway-auth Image
            name: ccure-gateway-auth
            context: .
            file: gateway/token_check/Dockerfile
            smoke: scripts/ci/smoke_gateway_auth.sh
            exceptions: .github/security/trivy-gateway-auth.yaml
            skip: ''
    env:
      # The canonical identity of the artifact: the commit it was built from.
      # Never `latest` — a tag that names "whatever was built last" cannot say
      # which code is running, and cannot be promoted without doubt.
      IMAGE: ${{ matrix.name }}:${{ github.sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The backend image is ~3.2 GB and BuildKit holds its layers and the
      # loaded copy at once. The hosted runner ships toolchains this job never
      # uses; removing them is what leaves room.
      - name: Free disk space
        if: matrix.context == 'Backend'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A layer cache keeps the OS packages from the day the layer was first
      # built. The Dockerfile's package lines do not change when Debian or
      # Alpine ship a fix, so a long-lived cache went on serving an old
      # Chromium for weeks, and the gate failed on findings a fresh build does
      # not have (measured 8 Oct 2026: 80 fixed-upstream HIGH/CRITICAL in a
      # cached Chromium 153, none in a fresh 154). The cache scope therefore
      # changes every UTC day, so the day's first build installs current
      # packages; the nightly run builds with no cache at all. This only
      # refreshes what is installed. Whatever the fresh image carries is
      # scanned and gated exactly as before.
      - name: Choose a layer cache that is at most a day old
        id: cache
        run: echo "scope=${{ matrix.name }}-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build ${{ env.IMAGE }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          # revision and source only. A build timestamp would make two builds
          # of one commit differ for no reason.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=${{ steps.cache.outputs.scope }}
          cache-to: type=gha,scope=${{ steps.cache.outputs.scope }},mode=max

      # Everything Trivy finds, blocking or not, counted in the job summary —
      # Python packages included, though the gate below leaves them to pip-audit.
      - name: Report every vulnerability
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" -v "$RUNNER_TEMP:/out" \
            "$TRIVY_IMAGE" image --quiet --scanners vuln --format json \
            -o /out/trivy.json "$IMAGE"
          python3 scripts/ci/trivy_summary.py "$RUNNER_TEMP/trivy.json" \
            "${{ matrix.title }}: all findings (report only)" >> "$GITHUB_STEP_SUMMARY"

      # The gate: CRITICAL and HIGH with a fixed version published, less the
      # reviewed, expiring exceptions for this image. Unfixed findings are in
      # the report above; blocking on them would leave the build red with
      # nothing anyone could do about it.
      - name: Fail on fixable critical or high vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -v "$GITHUB_WORKSPACE/.github/security:/cfg:ro" \
            "$TRIVY_IMAGE" image --quiet --scanners vuln \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            --ignorefile "/cfg/$(basename "${{ matrix.exceptions }}")" \
            ${{ matrix.skip }} "$IMAGE"

      # Runs the image the way compose does, against disposable dependencies
      # the script creates and removes. It never sees a real database.
      - name: Smoke test
        run: bash "${{ matrix.smoke }}" "$IMAGE"

      - name: Record the verified image
        run: |
          {
            echo "### ${{ matrix.title }}: verified"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$IMAGE\` |"
            echo "| Image ID | \`$(docker image inspect -f '{{.Id}}' "$IMAGE")\` |"
            echo "| Size | $(docker image inspect -f '{{.Size}}' "$IMAGE" | awk '{printf "%.0f MB", $1/1e6}') |"
            echo "| Revision label | \`$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")\` |"
            echo
            echo "Built, scanned and smoke-tested. Not published: pushing this exact image to a registry is the next phase."
          } >> "$GITHUB_STEP_SUMMARY"
