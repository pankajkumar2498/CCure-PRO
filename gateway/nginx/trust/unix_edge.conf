# ── trust boundary (Phase 10.6) ──────────────────────────────────────────────
# Exactly one kind of peer may assert the client address (X-Real-IP) and scheme
# (X-Forwarded-Proto): a connection on the edge's unix socket
# (listen/unix_edge.conf), which only host nginx can open.
#
# Every TCP peer — including a host process dialling the gateway's bridge
# address, which in 10.5 was indistinguishable from host nginx — is an
# ordinary client: its forwarding headers are ignored and its own socket
# address and `http` are what the application receives (proxy_api.conf SETS
# both headers, never appends).
set_real_ip_from unix:;

# $realip_remote_addr is the literal "unix:" for a unix-socket peer, which a
# `geo` block cannot match, hence a map.
map $realip_remote_addr $ccure_from_edge {
    default  0;
    "unix:"  1;
}
