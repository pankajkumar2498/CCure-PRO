# Site settings for the ALONGSIDE validation stack only (gateway/alongside/).
# Mounted as /etc/nginx/ccure/site.conf. Not used by the live stack.

upstream ccure_api {
    server api:8000;
}
upstream ccure_gateway_auth {
    server gateway-auth:8080;
}

# ── trust boundary ───────────────────────────────────────────────────────────
# The edge reaches the gateway through its loopback-published port, so the
# gateway sees it as the network's gateway address, 10.254.20.1 — exactly as
# the live API sees host nginx as 172.18.0.1 today (docker-proxy). That one
# peer, and no other, may assert the client address and scheme.
set_real_ip_from 10.254.20.1;

geo $realip_remote_addr $ccure_from_edge {
    default      0;
    10.254.20.1  1;
}
