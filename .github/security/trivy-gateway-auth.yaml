  # ── python:3.11-slim base image: setuptools 79.0.1's vendored copies (2)
  - id: CVE-2026-23949
    paths:
      - "usr/local/lib/python3.11/site-packages/setuptools/_vendor/jaraco.context-5.3.0.dist-info/METADATA"
    statement: >-
      HIGH in jaraco.context 5.3.0, vendored inside the setuptools 79.0.1 that the pinned python:3.11-slim base ships (not an application requirement); fixed in 6.1.0. Same base by digest and same entry as trivy-backend.yaml. Not upgraded in place: newer setuptools removes pkg_resources. Remediation: the Dependabot PR moving the base digest to a python:3.11-slim with a fixed setuptools.
    expired_at: 2026-10-24
