# ──────────────────────────────────────────────────────────────────────────────
# Phase 10.6 — the gateway trust boundary, tested with the PRODUCTION files.
# Run with run.sh. Its own project and internal network; nothing published,
# nothing live touched.
#
#   runner ──TLS──▶ edge-tls ──unix socket──▶ gateway ──▶ stub-api (echoes what it got)
#   runner ──────────────TCP :8080──────────▶ gateway      (a "host process")
#   runner ──unix socket as uid 1001 / 101──▶ refused by the filesystem
#   runner ──▶ frontend :80 /api/ ──TCP──▶ gateway   (10.7: an untrusted client)
#
# edge-tls runs the COMMITTED host nginx file, gateway/edge/host-nginx/
# ccure.gateway.conf, rewritten by run.sh in four mechanical places only (port
# 443→8443, 80→8080, the certificate paths, the IPv6 listeners dropped) and
# as uid 33 (www-data), exactly as host nginx's workers run. The gateway runs
# gateway.conf, proxy_api.conf, the route map, the trust file, the listener
# file and the socket clean-up script — all mounted unchanged.
# ──────────────────────────────────────────────────────────────────────────────

name: ccure-gw-trust

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

networks:
  trust:
    internal: true
    ipam:
      config:
        - subnet: 10.254.40.0/24
          gateway: 10.254.40.1

volumes:
  # The socket directory. edge-init makes it root:www-data(33) 0770, as
  # `gateway_edge_switch.sh harden` makes /var/lib/ccure-edge on the host.
  edge:

services:
  edge-init:
    image: ccure-audit-pro-backend:latest
    user: "0:0"
    network_mode: none
    command: ["sh", "-c", "chown 0:33 /edge && chmod 0770 /edge && find /edge -mindepth 1 -delete"]
    volumes:
      - edge:/edge
    logging: *default-logging

  stub-api:
    image: ccure-audit-pro-backend:latest
    command: ["python", "-m", "uvicorn", "stub_api:app", "--app-dir", "/harness",
              "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      CCURE_ROUTE_POLICY: /gateway/policy/route_policy.json
      CORS_ALLOW_ORIGINS: "https://ccurepro.cdac.in"
    volumes:
      - ../../harness/stub_api.py:/harness/stub_api.py:ro
      - ../../policy:/gateway/policy:ro
    networks:
      trust:
        ipv4_address: 10.254.40.20
    logging: *default-logging

  gateway:
    image: nginx@sha256:985220252f3863977e468f611ef118ebd01421289dd86ee1ae99cb068c3bce2b
    user: "101:101"
    group_add: ["33"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /run:uid=101,gid=101,mode=0755
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /tmp
    environment:
      CCURE_CORS_ALLOW_ORIGINS: "https://ccurepro.cdac.in"
    volumes:
      - ../../nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../nginx/proxy_api.conf:/etc/nginx/ccure/proxy_api.conf:ro
      - ../../policy/route_policy.map:/etc/nginx/ccure/route_policy.map:ro
      - ./site.conf:/etc/nginx/ccure/site.conf:ro
      - ../../nginx/trust/unix_edge.conf:/etc/nginx/ccure/edge_trust.conf:ro
      - ../../nginx/listen/unix_edge.conf:/etc/nginx/ccure/listen.d/unix_edge.conf:ro
      - ../../nginx/entrypoint/30-ccure-edge-socket.sh:/docker-entrypoint.d/30-ccure-edge-socket.sh:ro
      - ../../nginx/entrypoint/40-ccure-cors-origins.sh:/docker-entrypoint.d/40-ccure-cors-origins.sh:ro
      - edge:/run/ccure-edge
    depends_on:
      edge-init: {condition: service_completed_successfully}
      stub-api: {condition: service_started}
    networks:
      trust:
        ipv4_address: 10.254.40.10
    logging: *default-logging

  edge-tls:
    image: nginx@sha256:985220252f3863977e468f611ef118ebd01421289dd86ee1ae99cb068c3bce2b
    user: "33:33"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /run:uid=33,gid=33,mode=0755
      - /var/cache/nginx:uid=33,gid=33,mode=0755
      - /tmp
    volumes:
      - "${TRUST_WORK:?run via run.sh}/edge.conf:/etc/nginx/conf.d/default.conf:ro"
      - "${TRUST_WORK:?run via run.sh}/tls/edge:/etc/nginx/ssl:ro"
      - edge:/var/lib/ccure-edge
    depends_on:
      gateway: {condition: service_started}
    networks:
      trust:
        ipv4_address: 10.254.40.5
    logging: *default-logging

  # Phase 10.7: the frontend container's own /api/ path, from the COMMITTED
  # Frontend/nginx.conf with one rewrite (the gateway's address, by run.sh).
  frontend:
    image: nginx@sha256:985220252f3863977e468f611ef118ebd01421289dd86ee1ae99cb068c3bce2b
    read_only: true
    tmpfs:
      - /run
      - /var/cache/nginx
      - /tmp
    volumes:
      - "${TRUST_WORK:?run via run.sh}/frontend.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on:
      gateway: {condition: service_started}
    networks:
      trust:
        ipv4_address: 10.254.40.30
    logging: *default-logging

  runner:
    image: ccure-audit-pro-backend:latest
    profiles: ["run"]
    user: "0:0"
    working_dir: /t
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./tests:/t:ro
      - ../../../Backend/core/ip_resolver.py:/resolver/core/ip_resolver.py:ro
      - edge:/edge
    networks:
      trust:
        ipv4_address: 10.254.40.60
    logging: *default-logging
