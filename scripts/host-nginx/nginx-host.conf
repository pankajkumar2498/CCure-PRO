# ──────────────────────────────────────────────────────────────────────────────
# CCure Audit PRO — Host-Level Nginx Reverse Proxy
# ──────────────────────────────────────────────────────────────────────────────
# This config runs on the Windows HOST machine (outside Docker).
# It captures the REAL client IP from the TCP socket and forwards it
# to Docker containers via X-Forwarded-For.
#
# This is the ONLY way to get real client IPs on Docker Desktop (Windows/macOS).
#
# Architecture:
#   Client (10.180.6.x) → Host Nginx (:80) → captures real IP
#                          ├─ /api/*  → localhost:8000  (Docker API)
#                          └─ /*      → localhost:3000  (Docker Frontend)
# ──────────────────────────────────────────────────────────────────────────────

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # ── Logging ──────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;
    error_log   logs/error.log;

    # ── General Settings ─────────────────────────────────────────────────────
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;

    # ── WebSocket upgrade map ────────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       80;
        server_name  _;

        # ── Security Headers ─────────────────────────────────────────────────
        add_header X-Content-Type-Options  "nosniff" always;
        add_header X-Frame-Options         "DENY" always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

        # ── API Proxy ────────────────────────────────────────────────────────
        # Strips /api prefix: /api/auth/login → localhost:8000/auth/login
        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;

            # ── REAL CLIENT IP (the whole point of this proxy) ───────────────
            # $remote_addr HERE is the actual client machine IP because
            # this Nginx runs on the Windows host, OUTSIDE Docker.
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host              $host;

            # ── WebSocket support (scan progress streams) ────────────────────
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # ── SSE / streaming (notifications, long responses) ──────────────
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Frontend SPA ─────────────────────────────────────────────────────
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
