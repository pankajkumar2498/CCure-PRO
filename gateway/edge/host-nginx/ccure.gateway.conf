# ──────────────────────────────────────────────────────────────────────────────
# PRODUCTION GATEWAY PATH (Phase 10.5, transport hardened in 10.6). Installed as
# /etc/nginx/conf.d/ccure.conf by scripts/linux/gateway_edge_switch.sh; the
# pre-10.5 file is gateway/edge/host-nginx/ccure.direct.conf and is what
# `rollback` restores. The ONLY difference from it is the two proxy_pass
# targets below (and these comments): TLS, headers, HSTS, limit_req/limit_conn,
# the WebSocket map, buffering, timeouts, body size and the SPA location are
# byte-for-byte the same, which gateway/production/tests asserts.
#
# Why a unix socket (10.6): the gateway believes X-Real-IP / X-Forwarded-Proto
# only from this socket, and only root and www-data (this nginx) can open it —
# the directory is root:www-data 0770. Over TCP, host nginx and every other
# host process arrive as the same bridge address and cannot be told apart.
#
# Request bodies: this file keeps nginx's default proxy_request_buffering on,
# as before — an upload is still spooled here (client_body_temp_path) before it
# is proxied, and the gateway behind it streams (proxy_request_buffering off).
# Deliberately unchanged: docs/architecture/phase10/PHASE10_5_CUTOVER.md §5.
# ──────────────────────────────────────────────────────────────────────────────
# ──────────────────────────────────────────────────────────────────────────────
# CCure Audit PRO — Host-Level Nginx Reverse Proxy (TLS terminator), Linux dev box
# ──────────────────────────────────────────────────────────────────────────────
# Adapted from scripts/host-nginx/nginx-host.conf (the documented Windows-host
# production config) for this Ubuntu 24.04 development machine. Same design:
# host Nginx is the only process on a routable interface; the Docker published
# ports (127.0.0.1:8000 API, 127.0.0.1:3200 frontend) never leave loopback.
#
# Certificate: private CA at /etc/ccure-pki/ca/ccure-internal-ca.crt, issued by
# this machine's own openssl (see the session that created this file), NOT the
# same CA as the Windows production deployment's ccurepro.cdacb.in cert — this
# is a separate dev-only PKI for this box, hostname ccurepro.cdac.in, IP
# 10.180.22.127 (this machine's LAN address).
# ──────────────────────────────────────────────────────────────────────────────

server_tokens off;

# ── Rate limiting (edge layer) ───────────────────────────────────────────────
# Same reasoning as production: defence in depth, not the primary control.
# $binary_remote_addr because at this hop the socket peer *is* the client.
limit_req_zone $binary_remote_addr zone=ccure_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ccure_api:10m  rate=20r/s;

limit_req_status 429;
limit_conn_status 429;

map $status $ccure_retry_after_auth {
    429     "60";
    default "";
}
map $status $ccure_retry_after_api {
    429     "5";
    default "";
}

limit_conn_zone $binary_remote_addr zone=ccure_conn:10m;

# ── WebSocket upgrade map ────────────────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── TLS ───────────────────────────────────────────────────────────────────────
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;

client_max_body_size 50m;

# ── HTTP -> HTTPS redirect ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name ccurepro.cdac.in 10.180.22.127 localhost;

    ssl_certificate     /etc/nginx/ssl/ccure-fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/ccure.key;

    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Short max-age deliberately, matching the documented rollout stance:
    # HSTS is a one-way door. Raise together with Backend/main.py's
    # _HSTS_VALUE once every client is confirmed working.
    add_header Strict-Transport-Security "max-age=300" always;

    # ── Authentication endpoints ─────────────────────────────────────────────
    location /api/auth/ {
        limit_req  zone=ccure_auth burst=10 nodelay;
        limit_conn ccure_conn 40;

        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=300" always;
        add_header Retry-After $ccure_retry_after_auth always;
        proxy_hide_header X-Content-Type-Options;
        add_header X-Content-Type-Options "nosniff" always;

        # Through the API gateway, over its unix socket (Phase 10.6; 10.5 dialled
        # 172.31.254.10:8080). No URI part, so the request's own /api/... path is
        # passed unchanged and the gateway strips /api itself
        # (gateway/nginx/proxy_api.conf) — the application sees the same path
        # the pre-10.5 direct form gave it. Rollback: ccure.direct.conf.
        proxy_pass http://unix:/var/lib/ccure-edge/gateway.sock;
        proxy_http_version 1.1;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;

        proxy_buffering off;
        proxy_cache     off;
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        limit_req  zone=ccure_api burst=40 nodelay;
        limit_conn ccure_conn 40;

        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=300" always;
        add_header Retry-After $ccure_retry_after_api always;
        proxy_hide_header X-Content-Type-Options;
        add_header X-Content-Type-Options "nosniff" always;

        # Through the API gateway, over its unix socket (Phase 10.6; 10.5 dialled
        # 172.31.254.10:8080). No URI part, so the request's own /api/... path is
        # passed unchanged and the gateway strips /api itself
        # (gateway/nginx/proxy_api.conf) — the application sees the same path
        # the pre-10.5 direct form gave it. Rollback: ccure.direct.conf.
        proxy_pass http://unix:/var/lib/ccure-edge/gateway.sock;
        proxy_http_version 1.1;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Frontend SPA ─────────────────────────────────────────────────────────
    location / {
        proxy_hide_header Strict-Transport-Security;

        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
