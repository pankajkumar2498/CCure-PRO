repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Python Formatting (Black)
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        files: ^Backend/

  # Python Linting & Styling (Ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [ --fix, --ignore=E402, --ignore=F401, --ignore=F841, --ignore=E711, --ignore=E712, --ignore=E741, --ignore=F601, --ignore=E722, --ignore=F821 ]
        files: ^Backend/

  # Python Static Security Analysis (Bandit)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: [ "-lll", "-x", "tests", "--skip", "B324,B501,B507" ]
        files: ^Backend/

  # Frontend Formatting (Prettier)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^Frontend/
        additional_dependencies:
          - prettier@3.2.5

  # Frontend Linting (ESLint)
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.4.0
    hooks:
      - id: eslint
        files: ^Frontend/
        args: [ --max-warnings=0 ]
        additional_dependencies:
          - eslint@8.57.0
          - eslint-plugin-react@7.34.1
          - eslint-plugin-react-hooks@4.6.2
