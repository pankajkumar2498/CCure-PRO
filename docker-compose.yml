services:
  # ── Task Broker ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ccure-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - TZ=Asia/Kolkata
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Database ─────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: ccure-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ccure_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ccure_admin_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ccure_test}
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:${POSTGRES_PORT_BINDING:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ccure_user} -d $${POSTGRES_DB:-ccure_test}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── API Server ───────────────────────────────────────────────────────────
  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ccure-api
    restart: always
    command: ["sh", "-c", "tr -d '\\r' < /app/start.sh > /tmp/start.sh && chmod +x /tmp/start.sh && /tmp/start.sh"]
    environment:
      - TZ=Asia/Kolkata
      - DATABASE_URL=postgresql://${POSTGRES_USER:?Database user must be set}:${POSTGRES_PASSWORD:?Database password must be set}@${DATABASE_HOST:-db}:5432/${POSTGRES_DB:?Database name must be set}
      # Anyone running `docker exec <container> pytest` gets a suite that
      # TRUNCATEs organizations and users CASCADE. Without this it inherits
      # DATABASE_URL above and destroys the live database. Pin the scratch
      # database explicitly so the dangerous default is never reachable.
      - TEST_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST:-db}:5432/ccure_pytest_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - VULN_DB_HOST=${VULN_DB_HOST:-db}
      - VULN_DB_PORT=5432
      - VULN_DB_NAME=${VULN_DB_NAME:-vuln_intel}
      - VULN_DB_USER=${VULN_DB_USER:-admin}
      - VULN_DB_PASSWORD=${VULN_DB_PASSWORD:-root}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      # Master key for credentials stored at rest (scan logins, credentialed
      # scan passwords). Required, and it must be the SAME value the host
      # scanner worker loads from Backend/.env.
      #
      # This was previously `:-` (empty default). The API then encrypted stored
      # credentials under the fallback key hardcoded in security_crypto.py
      # while the host worker decrypted with the real key from Backend/.env, so
      # every credentialed scan failed with "Invalid encrypted payload or
      # authentication tag" and silently completed as an unauthenticated audit.
      # Failing to start is better than a scan that quietly loses its
      # credentials.
      #
      # Note: changing it makes credentials encrypted under the old key
      # unreadable, so re-enter stored credentials after setting it.
      - COMPLIANCE_ENCRYPTION_KEY=${COMPLIANCE_ENCRYPTION_KEY:?COMPLIANCE_ENCRYPTION_KEY must be set, and must match the value in Backend/.env used by the host scanner worker}
      - REFRESH_COOKIE_PATH=${REFRESH_COOKIE_PATH:-/}
      - APP_ENV=production
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-host.docker.internal}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SECURE=${SMTP_SECURE:-False}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-no-reply@ccureaudit.pro}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CELERY_TASK_ALWAYS_EAGER=${CELERY_TASK_ALWAYS_EAGER:-True}
      - RELOAD=false
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./Backend:/app
      - /app/.venv
      - ./Backend/reports:/app/reports
      # tests/test_docs_integrity.py reads these to check that every route,
      # table and permission in the code is documented. Without the mount the
      # test could not find docs/ at all and failed on three missing files,
      # which read as documentation drift and hid the one route that really was
      # undocumented.
      - ./docs:/docs:ro

  # ── Background Worker ────────────────────────────────────────────────────
  worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ccure-worker
    restart: always
    profiles: ["container-scanner"]
    # The worker MUST run as root to perform raw-socket scans (Scapy/Nmap)
    user: root
    command: ["celery", "-A", "core.celery_app", "worker", "--loglevel=info", "--queues=scanner,default,compliance", "--concurrency=${SCANNER_WORKER_CONCURRENCY:-20}", "--prefetch-multiplier=1"]
    environment:
      - TZ=Asia/Kolkata
      - DATABASE_URL=postgresql://${POSTGRES_USER:?Database user must be set}:${POSTGRES_PASSWORD:?Database password must be set}@${DATABASE_HOST:-db}:5432/${POSTGRES_DB:?Database name must be set}
      # Anyone running `docker exec <container> pytest` gets a suite that
      # TRUNCATEs organizations and users CASCADE. Without this it inherits
      # DATABASE_URL above and destroys the live database. Pin the scratch
      # database explicitly so the dangerous default is never reachable.
      - TEST_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST:-db}:5432/ccure_pytest_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - VULN_DB_HOST=${VULN_DB_HOST:-db}
      - VULN_DB_PORT=5432
      - VULN_DB_NAME=${VULN_DB_NAME:-vuln_intel}
      - VULN_DB_USER=${VULN_DB_USER:-admin}
      - VULN_DB_PASSWORD=${VULN_DB_PASSWORD:-root}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      # Master key for credentials stored at rest (scan logins, credentialed
      # scan passwords). Required, and it must be the SAME value the host
      # scanner worker loads from Backend/.env.
      #
      # This was previously `:-` (empty default). The API then encrypted stored
      # credentials under the fallback key hardcoded in security_crypto.py
      # while the host worker decrypted with the real key from Backend/.env, so
      # every credentialed scan failed with "Invalid encrypted payload or
      # authentication tag" and silently completed as an unauthenticated audit.
      # Failing to start is better than a scan that quietly loses its
      # credentials.
      #
      # Note: changing it makes credentials encrypted under the old key
      # unreadable, so re-enter stored credentials after setting it.
      - COMPLIANCE_ENCRYPTION_KEY=${COMPLIANCE_ENCRYPTION_KEY:?COMPLIANCE_ENCRYPTION_KEY must be set, and must match the value in Backend/.env used by the host scanner worker}
      - REFRESH_COOKIE_PATH=${REFRESH_COOKIE_PATH:-/}
      - APP_ENV=production
      - SMTP_HOST=${SMTP_HOST:-host.docker.internal}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SECURE=${SMTP_SECURE:-False}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-no-reply@ccureaudit.pro}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CELERY_TASK_ALWAYS_EAGER=${CELERY_TASK_ALWAYS_EAGER:-True}
      - SCANNER_RUNTIME=container
      - SCANNER_WORKER_CONCURRENCY=${SCANNER_WORKER_CONCURRENCY:-20}
      - MAX_NMAP_PROCESSES=${MAX_NMAP_PROCESSES:-20}
      - NMAP_THREADS=${NMAP_THREADS:-20}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Backend:/app
      - /app/.venv
      - ./Backend/reports:/app/reports

  # ── Web Application Scan Worker ───────────────────────────────────────────
  web-worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ccure-web-worker
    restart: always
    profiles: ["container-scanner"]
    # Run as root for raw socket access and Playwright browser launch
    user: root
    command: >
      celery -A core.celery_app worker --loglevel=info
      --queues=web_recon,web_crawl,web_dast,web_audit
      --concurrency=${WEB_WORKER_CONCURRENCY:-4}
      --prefetch-multiplier=1
    environment:
      - TZ=Asia/Kolkata
      - DATABASE_URL=postgresql://${POSTGRES_USER:?Database user must be set}:${POSTGRES_PASSWORD:?Database password must be set}@${DATABASE_HOST:-db}:5432/${POSTGRES_DB:?Database name must be set}
      # Anyone running `docker exec <container> pytest` gets a suite that
      # TRUNCATEs organizations and users CASCADE. Without this it inherits
      # DATABASE_URL above and destroys the live database. Pin the scratch
      # database explicitly so the dangerous default is never reachable.
      - TEST_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST:-db}:5432/ccure_pytest_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - VULN_DB_HOST=${VULN_DB_HOST:-db}
      - VULN_DB_PORT=5432
      - VULN_DB_NAME=${VULN_DB_NAME:-vuln_intel}
      - VULN_DB_USER=${VULN_DB_USER:-admin}
      - VULN_DB_PASSWORD=${VULN_DB_PASSWORD:-root}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      # Master key for credentials stored at rest (scan logins, credentialed
      # scan passwords). Required, and it must be the SAME value the host
      # scanner worker loads from Backend/.env.
      #
      # This was previously `:-` (empty default). The API then encrypted stored
      # credentials under the fallback key hardcoded in security_crypto.py
      # while the host worker decrypted with the real key from Backend/.env, so
      # every credentialed scan failed with "Invalid encrypted payload or
      # authentication tag" and silently completed as an unauthenticated audit.
      # Failing to start is better than a scan that quietly loses its
      # credentials.
      #
      # Note: changing it makes credentials encrypted under the old key
      # unreadable, so re-enter stored credentials after setting it.
      - COMPLIANCE_ENCRYPTION_KEY=${COMPLIANCE_ENCRYPTION_KEY:?COMPLIANCE_ENCRYPTION_KEY must be set, and must match the value in Backend/.env used by the host scanner worker}
      - APP_ENV=production
      - PLAYWRIGHT_BROWSERS_PATH=/opt/playwright
      - SMTP_HOST=${SMTP_HOST:-host.docker.internal}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SECURE=${SMTP_SECURE:-False}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-no-reply@ccureaudit.pro}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CELERY_TASK_ALWAYS_EAGER=${CELERY_TASK_ALWAYS_EAGER:-True}
      - NUCLEI_TEMPLATES_DIR=/opt/nuclei-templates
      - WEB_SCAN_RATE_LIMIT=${WEB_SCAN_RATE_LIMIT:-10}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Backend:/app
      - /app/.venv
      - ./Backend/reports:/app/reports

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: ccure-frontend
    restart: always
    ports:
      - "127.0.0.1:3200:80"
    environment:
      - TZ=Asia/Kolkata
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    depends_on:
      - api

  # ── Reverse Proxy Gateway ──────────────────────────────────────────────────
  # Single entry point: captures real client IPs for audit logging.
  # Access the application at http://<server-ip>:${GATEWAY_PORT:-80}
  gateway:
    image: nginx:stable-alpine
    container_name: ccure-gateway
    restart: always
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    environment:
      - TZ=Asia/Kolkata

volumes:
  pgdata:
