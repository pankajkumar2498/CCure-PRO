# `pre-commit install` installs both hook types: pre-commit (the checks below)
# and commit-msg (the AI co-author check). Every hook runs at the pre-commit
# stage unless it names another, so the commit-msg stage runs only the hook
# written for it. The `pre-commit` stage name needs pre-commit 3.2 or later.
minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # Secret detection. This is here because the repository shipped a live
  # Gmail app password and the production JWT signing key in .env.example —
  # the key that signs every access token, so anyone holding it could mint a
  # valid token for any user. Both were caught by reading the file, which is
  # not a control. Neither could be undone by editing: a committed secret
  # stays in the history and has to be rotated.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Python Formatting (Black)
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        files: ^Backend/

  # Python Linting & Styling (Ruff)
  #
  # `--select=E,F,W` is not decoration: it is the selection CI runs, and this
  # hook must not be weaker than the gate it exists to keep people out of.
  # Without it the hook takes ruff's *default* selection (E4, E7, E9, F),
  # which excludes every W rule. Two W605 invalid-escape-sequence errors were
  # committed cleanly through this hook and then failed the CI lint step,
  # which does pass --select=E,F,W. The pinned rev compounds it: ruff 0.4.8's
  # default selection misses W605 where the version CI installs reports it.
  #
  # Keep the ignore list identical to .github/workflows/ci.yml. E501 is
  # ignored here too, because black has already wrapped the line by the time
  # ruff sees it.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [ --fix, "--select=E,F,W", --ignore=E402, --ignore=F401, --ignore=F841, --ignore=E711, --ignore=E712, --ignore=E741, --ignore=F601, --ignore=E722, --ignore=F821, --ignore=E501 ]
        files: ^Backend/

  # Python Static Security Analysis (Bandit)
  #
  # Same version and selection as CI's gate: high severity, no --skip.
  # Deliberate exceptions are `# nosec BXXX` on the line, never a rule
  # switched off here. docs/ci/SECURITY_GATES.md says when one is acceptable.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [ "-lll", "-x", "tests" ]
        files: ^Backend/

  # Frontend Formatting (Prettier)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^(Frontend/|docs/.*\.md$)
        # A dated audit record, kept verbatim. Its INVENTORY.md is generated by
        # render_inventory.py beside it, and Prettier reads underscores in the
        # unquoted identifiers and SQL as emphasis: `database_query` became
        # `database*query` and the LIKE pattern 'pg\_%' became 'pg\*%'.
        exclude: ^docs/audits/plugin-audit-2026-10-14/
        additional_dependencies:
          - prettier@3.2.5

  # Frontend Linting (ESLint)
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.4.0
    hooks:
      - id: eslint
        files: ^Frontend/
        # The upstream hook declares `types: [javascript]`, and identify tags a
        # .jsx file as `jsx`, not `javascript`. This hook therefore matched no
        # file in this repository — every component is .jsx — and reported
        # "(no files to check)Skipped" on every commit while looking configured.
        # That is how 774 problems accumulated without anyone seeing one.
        #
        # `types` must be overridden, not just supplemented: pre-commit ANDs
        # `types` with `types_or`, so adding `types_or: [javascript, jsx]` on
        # its own still required the file to be `javascript` and changed
        # nothing. Widening `types` to `file` and letting `types_or` do the
        # selecting is what actually admits .jsx.
        types: [ file ]
        types_or: [ javascript, jsx ]
        # This hook sees only the files in the commit, so the number here is a
        # ceiling for a subset, not the codebase ratchet — errors are what it
        # blocks on. The whole-codebase ratchet is `npm run lint` in CI, which
        # runs the same rules over all of src/. Using 0 here would block a
        # commit that merely touches a file carrying a pre-existing
        # exhaustive-deps warning, which punishes the wrong person.
        args: [ --max-warnings=0 ]
        additional_dependencies:
          - eslint@8.57.0
          - eslint-plugin-react@7.34.1
          - eslint-plugin-react-hooks@4.6.2

  # No AI agent as a commit co-author (CLAUDE.md, "Commits made by AI agents").
  # Runs on the commit message, not the files: it rejects a Co-authored-by
  # trailer naming Claude, Anthropic, Codex, OpenAI, Copilot or another AI
  # agent, and allows human co-authors. It is the mechanical half of a rule
  # that otherwise depends on every agent having read the instructions.
  - repo: local
    hooks:
      - id: no-ai-coauthor
        name: no AI agent listed as a commit co-author
        language: python
        entry: python scripts/git/check_ai_coauthors.py
        stages: [commit-msg]

  # The architecture and secret-handling ratchets: layering, import cycles, the
  # identity boundary, organisation-setting references, the capability
  # ratchet, and the sudo-password and session-password guards. Every one is also a test in tests/repo or
  # tests/credentialed, but those need a disposable PostgreSQL and the backend's
  # dependencies, and nothing ran them while hosted CI was unavailable
  # (docs/ci/LOCAL_ENFORCEMENT.md). This runs the same rules with the standard
  # library only — no database, no network, no credentials — in about twelve
  # seconds, and only when backend code is staged. A failure names the rule and
  # the file; it never depends on the environment it runs in.
  - repo: local
    hooks:
      - id: architecture-guards
        name: architecture and secret-handling guards (stdlib, no database)
        language: python
        entry: python Backend/scripts/architecture/check.py
        pass_filenames: false
        require_serial: true
        files: ^Backend/(?!tests/).+\.py$

  # The API contract. CI fails a PR whose Backend/openapi.json differs by one
  # byte from what the code generates, and the file used to go stale whenever
  # a route or a docstring changed: about twenty catch-up commits in its
  # history. This regenerates it from the code being committed and stages it,
  # last, after the formatters. It runs only when backend code, requirements
  # or the contract are staged, and needs the backend's own Python environment
  # (Backend/.venv, or CCURE_BACKEND_PYTHON), which it finds itself; that is
  # why it is a local hook rather than an isolated one. A failure stops the
  # commit. CI's check is unchanged and stays the backstop for --no-verify and
  # for clones without the hooks installed.
  # Backend/scripts/openapi/precommit_hook.py says how it works.
  - repo: local
    hooks:
      - id: openapi-contract
        name: regenerate the API contract (Backend/openapi.json)
        language: python
        entry: python Backend/scripts/openapi/precommit_hook.py
        pass_filenames: false
        require_serial: true
        # pre-commit hides a passing hook's output; this is how the author sees
        # "regenerated and staged … (added GET /x)" when the contract moved.
        verbose: true
        files: ^Backend/(?!tests/).+\.py$|^Backend/(openapi\.json|requirements\.txt)$
