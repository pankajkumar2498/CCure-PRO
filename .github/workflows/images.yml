name: Images

# Source -> Docker build -> security scan -> immutable SHA-tagged image ->
# smoke test. Nothing is pushed anywhere: publishing to a registry is the next
# phase, and it will push the image this workflow built and verified, never a
# rebuild. Policy and procedure: docs/ci/CONTAINER_IMAGES.md.
#
# Same trigger shape as ci.yml and security.yml, for the same reason: push is
# filtered to master so a PR branch does not build everything twice.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Read-only token; no job references a secret. The layer cache below talks to
# the Actions cache service through the runner's own token, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_NODE_TYPE: node24
  # Trivy 0.74.0 by digest, run as a container like gitleaks in security.yml.
  TRIVY_IMAGE: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  image:
    name: ${{ matrix.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: Backend Image
            name: ccure-audit-pro-backend
            context: Backend
            smoke: scripts/ci/smoke_backend.sh
            exceptions: .github/security/trivy-backend.yaml
            # Python packages are pip-audit's (security.yml), with their own
            # reviewed backlog. Gating them here too would put one advisory
            # under two exception lists that drift apart. Everything else in
            # the image — Debian packages, the Go scanner binaries, the base
            # image's own Python tooling — is this gate's.
            skip: --skip-dirs /home/ccure/.local/lib/python3.11/site-packages
          - title: Frontend Image
            name: ccure-audit-pro-frontend
            context: Frontend
            smoke: scripts/ci/smoke_frontend.sh
            exceptions: .github/security/trivy-frontend.yaml
            skip: ''
    env:
      # The canonical identity of the artifact: the commit it was built from.
      # Never `latest` — a tag that names "whatever was built last" cannot say
      # which code is running, and cannot be promoted without doubt.
      IMAGE: ${{ matrix.name }}:${{ github.sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The backend image is ~3.2 GB and BuildKit holds its layers and the
      # loaded copy at once. The hosted runner ships toolchains this job never
      # uses; removing them is what leaves room.
      - name: Free disk space
        if: matrix.context == 'Backend'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ env.IMAGE }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          # revision and source only. A build timestamp would make two builds
          # of one commit differ for no reason.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # Everything Trivy finds, blocking or not, counted in the job summary —
      # Python packages included, though the gate below leaves them to pip-audit.
      - name: Report every vulnerability
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" -v "$RUNNER_TEMP:/out" \
            "$TRIVY_IMAGE" image --quiet --scanners vuln --format json \
            -o /out/trivy.json "$IMAGE"
          python3 scripts/ci/trivy_summary.py "$RUNNER_TEMP/trivy.json" \
            "${{ matrix.title }}: all findings (report only)" >> "$GITHUB_STEP_SUMMARY"

      # The gate: CRITICAL and HIGH with a fixed version published, less the
      # reviewed, expiring exceptions for this image. Unfixed findings are in
      # the report above; blocking on them would leave the build red with
      # nothing anyone could do about it.
      - name: Fail on fixable critical or high vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -v "$GITHUB_WORKSPACE/.github/security:/cfg:ro" \
            "$TRIVY_IMAGE" image --quiet --scanners vuln \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            --ignorefile "/cfg/$(basename "${{ matrix.exceptions }}")" \
            ${{ matrix.skip }} "$IMAGE"

      # Runs the image the way compose does, against disposable dependencies
      # the script creates and removes. It never sees a real database.
      - name: Smoke test
        run: bash "${{ matrix.smoke }}" "$IMAGE"

      - name: Record the verified image
        run: |
          {
            echo "### ${{ matrix.title }}: verified"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$IMAGE\` |"
            echo "| Image ID | \`$(docker image inspect -f '{{.Id}}' "$IMAGE")\` |"
            echo "| Size | $(docker image inspect -f '{{.Size}}' "$IMAGE" | awk '{printf "%.0f MB", $1/1e6}') |"
            echo "| Revision label | \`$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")\` |"
            echo
            echo "Built, scanned and smoke-tested. Not published: pushing this exact image to a registry is the next phase."
          } >> "$GITHUB_STEP_SUMMARY"
