# ──────────────────────────────────────────────────────────────────────────────
# CCure Audit PRO — Host-Level Nginx Reverse Proxy (TLS terminator)
# ──────────────────────────────────────────────────────────────────────────────
# This config runs on the Windows HOST machine (outside Docker).
# It captures the REAL client IP from the TCP socket and forwards it
# to Docker containers via X-Forwarded-For.
#
# This is the ONLY way to get real client IPs on Docker Desktop (Windows/macOS).
#
# Architecture:
#   Client (10.180.6.x) ─HTTPS→ Host Nginx (:443) → captures real IP
#                                 ├─ /api/*  → localhost:8000  (Docker API)
#                                 └─ /*      → localhost:3200  (Docker Frontend)
#   Client            ─HTTP→ Host Nginx (:80) → 301 to https
#
# ── Why TLS terminates here and nowhere else ─────────────────────────────────
# This is the only process listening on a routable interface; the Docker
# published ports are bound to 127.0.0.1 only. So one certificate at one hop
# encrypts everything that crosses the network. The hops behind it
# (127.0.0.1:8000 and 127.0.0.1:3200) never leave the loopback interface.
#
# ── Certificate ──────────────────────────────────────────────────────────────
# Issued by the private CA created by scripts\tls\new_internal_ca.ps1.
# A publicly-trusted certificate is impossible here: the application is reached
# at 10.180.6.14, and CA/Browser Forum baseline requirements forbid any public
# CA from issuing for a reserved IP range. Clients install the root once, with
# scripts\tls\install_client_trust.ps1.
#
# Renew the leaf with: scripts\tls\new_internal_ca.ps1 -RenewLeafOnly
# ──────────────────────────────────────────────────────────────────────────────

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # ── Logging ──────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;
    error_log   logs/error.log;

    # ── General Settings ─────────────────────────────────────────────────────
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;

    # Do not advertise the exact nginx version in Server: or on error pages.
    server_tokens off;

    # ── Rate limiting (edge layer) ───────────────────────────────────────────
    # Defence in depth, not the primary control. The application enforces the
    # limits that carry meaning — per-endpoint numbers, per-account lockout,
    # counters shared across workers through Redis — and it is the only layer
    # that can, because only it knows which account an attempt was against.
    #
    # What this layer adds is that a flood is refused *before* it costs a
    # Python worker, a database round trip and an Argon2 verification. Argon2
    # is deliberately expensive; a login flood is therefore a CPU exhaustion
    # attack on the API host regardless of whether any credential is guessed,
    # and the application cannot defend against that from inside the process
    # doing the work.
    #
    # $binary_remote_addr, not $http_x_forwarded_for: at this hop the socket
    # peer *is* the client, and keying on a header would let a caller pick its
    # own bucket. This is the same reasoning as TRUSTED_PROXIES in the API.
    #
    # Zones are sized at 10m, which holds roughly 160,000 addresses.
    limit_req_zone $binary_remote_addr zone=ccure_auth:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=ccure_api:10m  rate=20r/s;

    # 429, not the nginx default of 503. A rate limit is a client-side
    # condition and the SPA has to be able to tell it apart from an outage;
    # 503 says "this server is broken", which sends people to support.
    limit_req_status 429;
    limit_conn_status 429;

    # Retry-After for the refusals nginx generates itself. The application sets
    # its own from the limit that was breached; nginx cannot compute one, so
    # these are the zone's window rounded to something a client can act on.
    #
    # Keyed through a map on $status so the header appears on the 429 and
    # nowhere else — add_header with an empty value emits nothing, whereas a
    # literal value with `always` would put Retry-After on every 200 as well.
    map $status $ccure_retry_after_auth {
        429     "60";
        default "";
    }
    map $status $ccure_retry_after_api {
        429     "5";
        default "";
    }

    # One address should not be able to occupy every worker connection by
    # opening them and going quiet. Streaming endpoints hold a connection open
    # legitimately, so this is set well above what a browser needs (6 per
    # origin) rather than close to it.
    limit_conn_zone $binary_remote_addr zone=ccure_conn:10m;

    # ── WebSocket upgrade map ────────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── TLS ──────────────────────────────────────────────────────────────────
    # TLS 1.2 and 1.3 only. 1.0 and 1.1 are deprecated (RFC 8996) and this
    # product's own scanner reports them as findings — serving them here would
    # make the tool fail its own check.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # Forward secrecy only: every suite below is ECDHE, so recording today's
    # traffic and stealing the key later does not decrypt it.
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    # Session tickets off: without key rotation they undermine forward secrecy,
    # and nginx has no built-in rotation.
    ssl_session_tickets       off;

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen      80;
        server_name _;

        # 301 rather than 302: permanent is what browsers cache and what makes
        # the upgrade stick for clients that typed the bare address.
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ────────────────────────────────────────────────────────────────
    server {
        listen              443 ssl;
        http2               on;
        server_name         ccurepro.cdacb.in 10.180.6.14 localhost;

        ssl_certificate     ssl/ccure-fullchain.crt;
        ssl_certificate_key ssl/ccure.key;

        # ── Security Headers ─────────────────────────────────────────────────
        add_header X-Content-Type-Options  "nosniff" always;
        add_header X-Frame-Options         "DENY" always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

        # HSTS. Note this only takes effect for the *hostname* — RFC 6797
        # §8.1.1 requires browsers to ignore the header when the host is an IP
        # literal, so https://10.180.6.14 gets encryption but no HSTS. Access
        # the application as https://ccurepro.cdacb.in for this to mean anything.
        #
        # max-age is deliberately short (5 minutes) for the initial rollout: a
        # long max-age is a one-way door, and a client that has cached
        # "HTTPS-only" for a year cannot reach a broken deployment to be told
        # why. Raise to 31536000 once this is confirmed working from every
        # client, and add `includeSubDomains` only if every subdomain of
        # ccurepro.cdacb.in is also served over TLS.
        add_header Strict-Transport-Security "max-age=300" always;

        # ── Authentication endpoints ─────────────────────────────────────────
        # Tighter zone in front of the credential-handling routes. burst=10
        # with nodelay lets a normal person mistype a password a few times, and
        # lets the SPA fire the handful of calls a sign-in actually makes,
        # while a script settles to 30 requests a minute.
        #
        # This block exists only to attach the zone; everything else about it
        # must match the /api/ block below, so change the two together.
        location /api/auth/ {
            limit_req  zone=ccure_auth burst=10 nodelay;
            limit_conn ccure_conn 40;

            proxy_hide_header Strict-Transport-Security;
            add_header Strict-Transport-Security "max-age=300" always;
            add_header Retry-After $ccure_retry_after_auth always;
            # A 429 refused here is generated by nginx, so it never passes
            # through the application and carries none of the headers the API
            # sets on its own responses. This one matters on an error page with
            # an HTML body served from the origin that holds the session.
            #
            # proxy_hide_header for the same reason HSTS uses it: the API sets
            # this header too, and letting both through means every proxied
            # response carries it twice. Identical values here, so nothing
            # breaks today — but this file already has one header whose two
            # copies disagreed, and the fix is to have one emitter, not to rely
            # on them continuing to agree.
            proxy_hide_header X-Content-Type-Options;
            add_header X-Content-Type-Options "nosniff" always;

            proxy_pass http://127.0.0.1:8000/auth/;
            proxy_http_version 1.1;

            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host              $host;

            proxy_buffering    off;
            proxy_cache        off;
        }

        # ── API Proxy ────────────────────────────────────────────────────────
        # Strips /api prefix: /api/auth/login → localhost:8000/auth/login
        location /api/ {
            # Generous: this covers the whole authenticated application, and a
            # dashboard opening ten panels at once is normal traffic. burst
            # absorbs that; the sustained rate is what a scripted sweep hits.
            limit_req  zone=ccure_api burst=40 nodelay;
            limit_conn ccure_conn 40;

            # The API sets its own security headers, and they are stricter than
            # the server-level ones above: `Content-Security-Policy: default-src
            # 'none'` and `Referrer-Policy: no-referrer`, which suit a response
            # that is only ever JSON or a file.
            #
            # Declaring add_header inside a location replaces the inherited set
            # rather than adding to it, which is what is wanted here. Without
            # this block every API response carried each header twice — and for
            # Referrer-Policy the two values *disagreed*: the browser saw both
            # `no-referrer` from the app and `strict-origin-when-cross-origin`
            # from Nginx, and the weaker one won. Duplicated headers also mean
            # that raising one HSTS max-age and not the other silently does
            # nothing, because a UA processes only the first.
            #
            # HSTS stays Nginx's responsibility on this path: it is the hop that
            # actually terminated TLS and therefore the only one entitled to
            # make the claim.
            proxy_hide_header Strict-Transport-Security;
            add_header Strict-Transport-Security "max-age=300" always;
            add_header Retry-After $ccure_retry_after_api always;
            # See the note in /api/auth/ above: nginx-generated refusals bypass
            # the application entirely, and one emitter beats two that agree.
            proxy_hide_header X-Content-Type-Options;
            add_header X-Content-Type-Options "nosniff" always;

            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;

            # ── REAL CLIENT IP (the whole point of this proxy) ───────────────
            # $remote_addr HERE is the actual client machine IP because
            # this Nginx runs on the Windows host, OUTSIDE Docker.
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            # Now reports "https", which is what makes the backend mark the
            # refresh cookie Secure and build https:// links in emails.
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host              $host;

            # ── WebSocket support (scan progress streams) ────────────────────
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # ── SSE / streaming (notifications, long responses) ──────────────
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Frontend SPA ─────────────────────────────────────────────────────
        location / {
            # The frontend container declares its own HSTS with a one-year
            # max-age. A UA processes only the *first* Strict-Transport-Security
            # header it receives, so letting both through would make which value
            # applies depend on header ordering — and could pin a client to
            # HTTPS for a year during a rollout deliberately using 300 seconds.
            #
            # This hop terminated TLS, so this hop decides. The container's value
            # is left in place for the case where it is served directly.
            proxy_hide_header Strict-Transport-Security;

            proxy_pass http://127.0.0.1:3200;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
