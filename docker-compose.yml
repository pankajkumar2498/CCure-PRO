# Every service logs through json-file with rotation. Docker's default is the
# same driver with NO cap, so a chatty worker fills the disk one line at a
# time and the first symptom is PostgreSQL refusing writes. 20 MB x 5 files
# per container is ~100 MB worst case each; Portainer and `docker logs` read
# the rotated files transparently.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ── Task Broker ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ccure-redis
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - TZ=Asia/Kolkata
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Database ─────────────────────────────────────────────────────────────
  db:
    # 18, matching the PostgreSQL this deployment's data came from. A dump taken
    # by pg_dump 18 carries archive format 1.16-0, which a 15 server cannot
    # read, so the version is a property of the data rather than a preference.
    #
    # The volume is `pgdata18` and not `pgdata` because a data directory
    # initialised by 15 makes an 18 server refuse to start. Keeping the old name
    # unused leaves the pre-migration cluster intact and rollback is a one-line
    # change here.
    image: postgres:18-alpine
    container_name: ccure-db
    logging: *default-logging
    restart: unless-stopped
    # Sized for this VM: 15 GB and 8 CPUs, shared with the API and a 20-thread
    # scanner worker. The image's defaults (shared_buffers 128 MB, work_mem
    # 4 MB) assume a container that might have half a gigabyte; vuln_intel
    # alone is 7 GB. Measured 17 Sep 2026: every other container together
    # holds ~3.2 GB, so 2 GB of buffers and a 6 GB cache estimate leave room.
    #
    # shm_size is not tuning. Parallel workers exchange data through POSIX
    # shared memory under /dev/shm, which Docker caps at 64 MB; past that a
    # parallel query fails with "could not resize shared memory segment … No
    # space left on device" — an error that reads as a full disk.
    shm_size: 1gb
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=16MB
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
    environment:
      # The bootstrap superuser is deliberately NOT the application role.
      # PostgreSQL will not let SUPERUSER be removed from whichever role initdb
      # creates, so if that were `ccure_user` the application would permanently
      # hold superuser and bypass the audit-retention privilege boundary. The
      # application role is created NOSUPERUSER by docker-postgres-init.sql,
      # which is handed its password here.
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Database superuser password must be set}
      POSTGRES_DB: ${POSTGRES_DB:-ccure_db}
      CCURE_APP_PASSWORD: ${POSTGRES_PASSWORD:?Application database password must be set}
      VULN_DB_PASSWORD: ${VULN_DB_PASSWORD:-root}
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:${POSTGRES_PORT_BINDING:-5433}:5432"
    volumes:
      # 18+ mounts one volume at /var/lib/postgresql and puts the cluster in a
      # version subdirectory below it; the old /var/lib/postgresql/data target
      # makes the image refuse to start, reporting the mount as unused.
      - pgdata18:/var/lib/postgresql
      - ./scripts/docker-postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-ccure_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── API Server ───────────────────────────────────────────────────────────
  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: ccure-audit-pro-backend:latest
    container_name: ccure-api
    logging: *default-logging
    restart: unless-stopped
    command: ["sh", "-c", "tr -d '\\r' < /app/start.sh > /tmp/start.sh && chmod +x /tmp/start.sh && /tmp/start.sh"]
    environment:
      - TZ=Asia/Kolkata
      - DATABASE_URL=postgresql://${POSTGRES_USER:?Database user must be set}:${POSTGRES_PASSWORD:?Database password must be set}@${DATABASE_HOST:-db}:5432/${POSTGRES_DB:?Database name must be set}?sslmode=${PGSSLMODE:-verify-full}&sslrootcert=/etc/ssl/ccure/ccure-internal-ca.crt
      - TEST_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST:-db}:5432/ccure_pytest_db?sslmode=${PGSSLMODE:-verify-full}&sslrootcert=/etc/ssl/ccure/ccure-internal-ca.crt
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - VULN_DB_HOST=${VULN_DB_HOST:-db}
      # TLS for the vuln_intel connection, which config.py assembles from
      # VULN_DB_* rather than from a hardcoded URL — the container and the
      # host worker need different hosts and different certificate paths.
      - PGSSLMODE=${PGSSLMODE:-verify-full}
      - PGSSLROOTCERT=/etc/ssl/ccure/ccure-internal-ca.crt
      - VULN_DB_PORT=5432
      - VULN_DB_NAME=${VULN_DB_NAME:-vuln_intel}
      - VULN_DB_USER=${VULN_DB_USER:-admin}
      - VULN_DB_PASSWORD=${VULN_DB_PASSWORD:-root}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - COMPLIANCE_ENCRYPTION_KEY=${COMPLIANCE_ENCRYPTION_KEY:?COMPLIANCE_ENCRYPTION_KEY must be set, and must match the value in Backend/.env used by the host scanner worker}
      - REFRESH_COOKIE_PATH=${REFRESH_COOKIE_PATH:-/}
      # Set explicitly rather than left to Backend/.env: auth/router.py reads
      # these with os.getenv at import time, so whether the dotenv load had
      # already happened depended on import order. A cookie silently losing
      # its Secure flag is not a failure anyone would notice.
      - REFRESH_COOKIE_SECURE=${REFRESH_COOKIE_SECURE:-false}
      - REFRESH_COOKIE_SAMESITE=${REFRESH_COOKIE_SAMESITE:-lax}
      - APP_ENV=production
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-host.docker.internal}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SECURE=${SMTP_SECURE:-False}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-no-reply@ccureaudit.pro}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CELERY_TASK_ALWAYS_EAGER=${CELERY_TASK_ALWAYS_EAGER:-True}
      - RELOAD=false
      # Token signing keyset (Phase 9.3), mounted below. The api is the only
      # service that verifies or will sign platform tokens; worker, web-worker
      # and beat deliberately get neither the variable nor the mount.
      - CCURE_TOKEN_KEYS_DIR=/run/ccure/keys
      # The algorithm new tokens are issued with (Phase 9.4). ES256 needs an
      # active key in the keyset above, or the api refuses to start; HS256 is
      # the rollback. Set in the root .env while a deployment's key is not yet
      # active.
      - CCURE_TOKEN_SIGNING_ALG=${CCURE_TOKEN_SIGNING_ALG:-ES256}
      # Whether legacy HS256 tokens still verify (step 9.6). true until the
      # measured cut-off (Phase 9 doc §17); false then refuses every HS256
      # token, and the api refuses to start with HS256 issuance selected.
      - CCURE_ACCEPT_LEGACY_HS256=${CCURE_ACCEPT_LEGACY_HS256:-true}
      # Which peers may assert the client address and scheme (core/trusted_proxy.py,
      # Phase 10.3). Exact addresses, never a range:
      #   172.31.254.10  api-gateway — the production path since Phase 10.5;
      #   172.18.0.1     host nginx through the published :8000 — the path the
      #                  10.5 rollback restores, and the direct port 10.7 closes;
      #   127.0.0.1, ::1 in-container callers.
      # config.py's default is the same list without the gateway.
      - TRUSTED_PROXIES=127.0.0.1,::1,172.18.0.1,172.31.254.10
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      # The default network carries the default route and the published :8000
      # (whose peer therefore stays 172.18.0.1 — measured with two networks);
      # `gateway` is where api-gateway reaches the api, at a fixed address.
      default:
        gw_priority: 1
      gateway:
        ipv4_address: 172.31.254.20
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./Backend:/app
      # Token signing keys: a host directory OUTSIDE the repository, read-only.
      # Required rather than defaulted: a missing source would otherwise be
      # created empty by Docker and read as "no keyset". Private key files are
      # owned by the container user (uid 1000) with mode 600 -- see
      # scripts/security/manage_token_keys.py for generation and rotation.
      - ${CCURE_TOKEN_KEYS_HOST_DIR:?CCURE_TOKEN_KEYS_HOST_DIR must name the token signing keyset directory (outside the repository)}:/run/ccure/keys:ro
      # Internal root CA, so libpq can verify the PostgreSQL server
      # certificate (sslmode=verify-full). Read-only: the container has
      # no reason to alter a trust anchor.
      - ./certs/ccure-internal-ca.crt:/etc/ssl/ccure/ccure-internal-ca.crt:ro
      - backend_venv:/app/.venv
      - ./Backend/reports:/app/reports
      - ./docs:/docs:ro
      # Database dumps, read-only. `core/audit_retention.assert_backup_recent`
      # refuses an audit purge without a dump newer than
      # AUDIT_RETENTION_REQUIRE_BACKUP_HOURS, and reads nothing but the newest
      # file's mtime -- it never writes here and never prunes, so `ro` costs
      # nothing and removes the possibility.
      #
      # The target is `/backups` because that is exactly what the config
      # default resolves to inside the container: AUDIT_RETENTION_BACKUP_DIR
      # falls back to BACKEND_DIR.parent/"backups", and BACKEND_DIR is /app, so
      # its parent is /. Mounting here means host and container agree with no
      # environment variable to keep in step.
      #
      # On the host worker the same default resolves to the repository's own
      # backups/ directory and is already correct -- which is why the scheduled
      # purge was never affected, and why only container-run paths (the CLI and
      # the retention preview endpoint) reported "none found".
      - ./backups:/backups:ro

  # ── Background Worker ────────────────────────────────────────────────────
  worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: ccure-audit-pro-backend:latest
    container_name: ccure-worker
    logging: *default-logging
    restart: unless-stopped
    profiles: ["container-scanner"]
    # The worker MUST run as root to perform raw-socket scans (Scapy/Nmap)
    user: root
    # Raw-socket scanning needs two things Docker's defaults do not provide, and
    # without either one the scanner reports a clean network rather than failing.
    #
    #   network_mode: host — ARP is Layer 2 and does not cross the bridge's NAT
    #   boundary. A bridge-networked worker resolves the 172.x bridge and finds
    #   the physical LAN empty, which is why the Windows deployment ran this
    #   worker outside Docker entirely. Host networking is the Linux equivalent:
    #   the scanner sits on the real interface.
    #
    #   cap_add NET_ADMIN — the Dockerfile grants /usr/bin/nmap the file
    #   capabilities cap_net_raw,cap_net_admin,cap_net_bind_service+eip. When a
    #   file capability falls outside the container's bounding set, execve itself
    #   fails with EPERM, so nmap cannot start at all — as root or otherwise.
    #   NET_RAW is in Docker's default set; NET_ADMIN is not, and is named here
    #   because the setcap line asks for it.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: ["celery", "-A", "core.celery_app", "worker", "--loglevel=info", "--queues=scanner,default,compliance", "--concurrency=${SCANNER_WORKER_CONCURRENCY:-20}", "--prefetch-multiplier=1"]
    environment:
      - TZ=Asia/Kolkata
      # Host networking means no Compose DNS: `db` and `redis` do not resolve
      # here. Both are reached through the ports they publish on loopback, so
      # the port is POSTGRES_PORT_BINDING — the published one — and not 5432,
      # which is the port inside the database container's own namespace.
      - DATABASE_URL=postgresql://${POSTGRES_USER:?Database user must be set}:${POSTGRES_PASSWORD:?Database password must be set}@127.0.0.1:${POSTGRES_PORT_BINDING:-5433}/${POSTGRES_DB:?Database name must be set}?sslmode=${PGSSLMODE:-verify-full}&sslrootcert=/etc/ssl/ccure/ccure-internal-ca.crt
      - TEST_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT_BINDING:-5433}/ccure_pytest_db?sslmode=${PGSSLMODE:-verify-full}&sslrootcert=/etc/ssl/ccure/ccure-internal-ca.crt
      - CELERY_BROKER_URL=redis://127.0.0.1:6379/0
      - CELERY_RESULT_BACKEND=redis://127.0.0.1:6379/0
      - VULN_DB_HOST=127.0.0.1
      # TLS for the vuln_intel connection, which config.py assembles from
      # VULN_DB_* rather than from a hardcoded URL — the container and the
      # host worker need different hosts and different certificate paths.
      - PGSSLMODE=${PGSSLMODE:-verify-full}
      - PGSSLROOTCERT=/etc/ssl/ccure/ccure-internal-ca.crt
      - VULN_DB_PORT=${POSTGRES_PORT_BINDING:-5433}
      - VULN_DB_NAME=${VULN_DB_NAME:-vuln_intel}
      - VULN_DB_USER=${VULN_DB_USER:-admin}
      - VULN_DB_PASSWORD=${VULN_DB_PASSWORD:-root}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - COMPLIANCE_ENCRYPTION_KEY=${COMPLIANCE_ENCRYPTION_KEY:?COMPLIANCE_ENCRYPTION_KEY must be set, and must match the value in Backend/.env used by the host scanner worker}
      - REFRESH_COOKIE_PATH=${REFRESH_COOKIE_PATH:-/}
      # Set explicitly rather than left to Backend/.env: auth/router.py reads
      # these with os.getenv at import time, so whether the dotenv load had
      # already happened depended on import order. A cookie silently losing
      # its Secure flag is not a failure anyone would notice.
      - REFRESH_COOKIE_SECURE=${REFRESH_COOKIE_SECURE:-false}
      - REFRESH_COOKIE_SAMESITE=${REFRESH_COOKIE_SAMESITE:-lax}
      - APP_ENV=production
      # host.docker.internal does not exist under host networking, and it has no
      # reason to: the host's own loopback is what that name pointed at.
      - SMTP_HOST=${SMTP_HOST:-127.0.0.1}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SECURE=${SMTP_SECURE:-False}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-no-reply@ccureaudit.pro}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CELERY_TASK_ALWAYS_EAGER=${CELERY_TASK_ALWAYS_EAGER:-True}
      - SCANNER_RUNTIME=container
      - SCANNER_WORKER_CONCURRENCY=${SCANNER_WORKER_CONCURRENCY:-20}
      - MAX_NMAP_PROCESSES=${MAX_NMAP_PROCESSES:-20}
      - NMAP_THREADS=${NMAP_THREADS:-20}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./Backend:/app
      # Internal root CA, so libpq can verify the PostgreSQL server
      # certificate (sslmode=verify-full). Read-only: the container has
      # no reason to alter a trust anchor.
      - ./certs/ccure-internal-ca.crt:/etc/ssl/ccure/ccure-internal-ca.crt:ro
      - backend_venv:/app/.venv
      - ./Backend/reports:/app/reports
      # Database dumps, read-only. `core/audit_retention.assert_backup_recent`
      # refuses an audit purge without a dump newer than
      # AUDIT_RETENTION_REQUIRE_BACKUP_HOURS, and reads nothing but the newest
      # file's mtime -- it never writes here and never prunes, so `ro` costs
      # nothing and removes the possibility.
      #
      # The target is `/backups` because that is exactly what the config
      # default resolves to inside the container: AUDIT_RETENTION_BACKUP_DIR
      # falls back to BACKEND_DIR.parent/"backups", and BACKEND_DIR is /app, so
      # its parent is /. Mounting here means host and container agree with no
      # environment variable to keep in step.
      #
      # On the host worker the same default resolves to the repository's own
      # backups/ directory and is already correct -- which is why the scheduled
      # purge was never affected, and why only container-run paths (the CLI and
      # the retention preview endpoint) reported "none found".
      - ./backups:/backups:ro

  # ── Celery Beat (scheduler) ───────────────────────────────────────────────
  #
  # `celery_app.conf.beat_schedule` has always defined periodic tasks, and until
  # now nothing ran them. No service started a beat process, and the only place
  # the command appeared was as a copy-paste line in DEVELOPER_SETUP_GUIDE.md.
  # Compliance scheduling and the stale-account purge were both silently dead:
  # they looked configured, they were registered with Celery, and they never
  # fired.
  #
  # Beat only *publishes* — the tasks are executed by whichever worker consumes
  # the queue, which on this deployment is the host scanner worker
  # (--queues=scanner,default). So this container is small and holds no scanning
  # privileges.
  #
  # Deliberately NOT behind the `container-scanner` profile. The profile exists
  # to keep raw-socket scan workers out of the default `up`, and applying it
  # here is what would leave the scheduler off again by default.
  #
  # Exactly one beat process may run at a time. Two schedulers publish every
  # task twice, and the second copy of "purge stale accounts" is not harmless.
  beat:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: ccure-audit-pro-backend:latest
    container_name: ccure-beat
    logging: *default-logging
    # `unless-stopped`, matching every other service here.
    #
    # This was `no` while the scanner ran as a process on the Windows host: a
    # scheduler that came back on its own after a reboot would have published
    # into a broker with no worker consuming it, and the every-60s compliance
    # task alone would queue hundreds of messages that all fired at once
    # whenever someone next started that host worker.
    #
    # On Linux the worker is a service in this stack under the same policy, so
    # the scheduler and its consumer come back together and that hazard is the
    # one thing that cannot happen. What the old setting did instead was leave
    # the whole deployment down after a reboot until someone logged in.
    restart: unless-stopped
    # --schedule is not cosmetic. Beat's default is a `celerybeat-schedule`
    # shelve file in the working directory, and the working directory is /app,
    # which is the bind-mounted repository — so the scheduler's state file
    # appears as an untracked binary in the working tree and gets committed by
    # accident. It lives in a named volume instead, which also means last-run
    # times survive a container rebuild.
    #
    # The chown is required and cannot be dropped: Docker creates a named
    # volume's mountpoint owned by root, the image runs as uid 1000 (ccure), and
    # beat then dies with EACCES on its own state file. Starting as root to fix
    # the ownership and immediately dropping back with setpriv keeps the
    # scheduler itself unprivileged — it publishes messages and needs nothing
    # else.
    user: root
    command:
      - sh
      - -c
      - >-
        chown ccure:ccure /var/lib/ccure-beat &&
        exec setpriv --reuid=ccure --regid=ccure --init-groups
        celery -A core.celery_app beat --loglevel=info
        --schedule=/var/lib/ccure-beat/celerybeat-schedule
    environment:
      - TZ=Asia/Kolkata
      - DATABASE_URL=postgresql://${POSTGRES_USER:?Database user must be set}:${POSTGRES_PASSWORD:?Database password must be set}@${DATABASE_HOST:-db}:5432/${POSTGRES_DB:?Database name must be set}?sslmode=${PGSSLMODE:-verify-full}&sslrootcert=/etc/ssl/ccure/ccure-internal-ca.crt
      - TEST_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST:-db}:5432/ccure_pytest_db?sslmode=${PGSSLMODE:-verify-full}&sslrootcert=/etc/ssl/ccure/ccure-internal-ca.crt
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PGSSLMODE=${PGSSLMODE:-verify-full}
      - PGSSLROOTCERT=/etc/ssl/ccure/ccure-internal-ca.crt
      - VULN_DB_HOST=${VULN_DB_HOST:-db}
      - VULN_DB_PORT=5432
      - VULN_DB_NAME=${VULN_DB_NAME:-vuln_intel}
      - VULN_DB_USER=${VULN_DB_USER:-admin}
      - VULN_DB_PASSWORD=${VULN_DB_PASSWORD:-root}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - COMPLIANCE_ENCRYPTION_KEY=${COMPLIANCE_ENCRYPTION_KEY:?COMPLIANCE_ENCRYPTION_KEY must be set, and must match the value in Backend/.env used by the host scanner worker}
      - APP_ENV=production
      - SMTP_HOST=${SMTP_HOST:-host.docker.internal}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SECURE=${SMTP_SECURE:-False}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-no-reply@ccureaudit.pro}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      # Beat must never run tasks in-process. Eager mode would execute every
      # scheduled job inside the scheduler, serially, with no worker involved.
      - CELERY_TASK_ALWAYS_EAGER=False
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Backend:/app
      - ./certs/ccure-internal-ca.crt:/etc/ssl/ccure/ccure-internal-ca.crt:ro
      - backend_venv:/app/.venv
      - beat_state:/var/lib/ccure-beat

  # ── Web Application Scan Worker ───────────────────────────────────────────
  web-worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: ccure-audit-pro-backend:latest
    container_name: ccure-web-worker
    logging: *default-logging
    restart: unless-stopped
    profiles: ["container-scanner"]
    # Run as root for raw socket access and Playwright browser launch
    user: root
    command: >
      celery -A core.celery_app worker --loglevel=info
      --queues=web_recon,web_crawl,web_dast,web_audit
      --concurrency=${WEB_WORKER_CONCURRENCY:-4}
      --prefetch-multiplier=1
    environment:
      - TZ=Asia/Kolkata
      - DATABASE_URL=postgresql://${POSTGRES_USER:?Database user must be set}:${POSTGRES_PASSWORD:?Database password must be set}@${DATABASE_HOST:-db}:5432/${POSTGRES_DB:?Database name must be set}?sslmode=${PGSSLMODE:-verify-full}&sslrootcert=/etc/ssl/ccure/ccure-internal-ca.crt
      - TEST_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST:-db}:5432/ccure_pytest_db?sslmode=${PGSSLMODE:-verify-full}&sslrootcert=/etc/ssl/ccure/ccure-internal-ca.crt
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - VULN_DB_HOST=${VULN_DB_HOST:-db}
      # TLS for the vuln_intel connection, which config.py assembles from
      # VULN_DB_* rather than from a hardcoded URL — the container and the
      # host worker need different hosts and different certificate paths.
      - PGSSLMODE=${PGSSLMODE:-verify-full}
      - PGSSLROOTCERT=/etc/ssl/ccure/ccure-internal-ca.crt
      - VULN_DB_PORT=5432
      - VULN_DB_NAME=${VULN_DB_NAME:-vuln_intel}
      - VULN_DB_USER=${VULN_DB_USER:-admin}
      - VULN_DB_PASSWORD=${VULN_DB_PASSWORD:-root}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - COMPLIANCE_ENCRYPTION_KEY=${COMPLIANCE_ENCRYPTION_KEY:?COMPLIANCE_ENCRYPTION_KEY must be set, and must match the value in Backend/.env used by the host scanner worker}
      - APP_ENV=production
      - PLAYWRIGHT_BROWSERS_PATH=/opt/playwright
      - SMTP_HOST=${SMTP_HOST:-host.docker.internal}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SECURE=${SMTP_SECURE:-False}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-no-reply@ccureaudit.pro}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CELERY_TASK_ALWAYS_EAGER=${CELERY_TASK_ALWAYS_EAGER:-True}
      - NUCLEI_TEMPLATES_DIR=/opt/nuclei-templates
      - WEB_SCAN_RATE_LIMIT=${WEB_SCAN_RATE_LIMIT:-10}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Backend:/app
      # Internal root CA, so libpq can verify the PostgreSQL server
      # certificate (sslmode=verify-full). Read-only: the container has
      # no reason to alter a trust anchor.
      - ./certs/ccure-internal-ca.crt:/etc/ssl/ccure/ccure-internal-ca.crt:ro
      - backend_venv:/app/.venv
      - ./Backend/reports:/app/reports

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: ccure-frontend
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:80"
    environment:
      - TZ=Asia/Kolkata
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    depends_on:
      - api

  # ── Reverse Proxy Gateway (opt-in; not used by this deployment) ────────────
  # Single entry point: captures real client IPs for audit logging.
  #
  # Host Nginx does this job on 443 and does it over TLS — see docs/TLS_SETUP.md
  # and the "TLS" section of CLAUDE.md. It terminates TLS, sets HSTS, forwards
  # the real client IP the same way, and is the only listener on a routable
  # interface. Every other published port in this file is bound to 127.0.0.1
  # precisely so that stays true. Audit logs confirm it works: they carry real
  # per-user LAN addresses, where the pre-host-Nginx rows all read 172.18.0.1,
  # the Docker bridge address every client used to collapse into.
  #
  # Reaching the application through this gateway instead would also break
  # sessions rather than merely expose them. REFRESH_COOKIE_SECURE is set
  # statically in .env and is not derived from X-Forwarded-Proto, so over plain
  # HTTP the browser refuses to store the refresh cookie at all and every
  # session dies at the 30-minute access-token expiry with no silent refresh.
  #
  # Two things therefore keep it from starting by accident:
  #
  #   * the `alt-gateway` profile — `docker compose up` cannot start this
  #     service, only `docker compose --profile alt-gateway up` can;
  #   * the 127.0.0.1 bind — if it is started, it is reachable from this host
  #     only, never from the LAN. The mapping previously carried no bind
  #     address, so Docker published it on 0.0.0.0.
  #
  # The default is 8082, the value .env already sets, so the port is the same
  # whether or not .env is present. It is deliberately *not* 80 — the previous
  # default, which collides head-on with host Nginx's 0.0.0.0:80 redirect
  # listener — and deliberately not 8080, which on this host belongs to the
  # Oracle XE TNS listener.
  #
  # It stays defined, with `restart: "no"`, for deployments that terminate TLS
  # elsewhere. Such a deployment binds it outward deliberately, and opens the
  # firewall deliberately; neither can now happen by omission.
  gateway:
    image: nginx:stable-alpine
    container_name: ccure-gateway
    logging: *default-logging
    restart: unless-stopped
    profiles: ["alt-gateway"]
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8082}:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    environment:
      - TZ=Asia/Kolkata

  # ── API gateway (Phase 10.5) ───────────────────────────────────────────────
  #
  #   client ─TLS─▶ host nginx :443 ─▶ api-gateway ──auth_request──▶ gateway-auth
  #                 (/etc/nginx)        172.31.254.10 └────────────▶ api 172.31.254.20
  #
  # Not the `gateway` service above: that one is the older, unauthenticated
  # alt-gateway and stays parked behind its profile. These two are the
  # committed Phase 10.2 artefacts — gateway/nginx/gateway.conf, proxy_api.conf,
  # the generated route map and gateway/token_check — with the production site
  # file (gateway/nginx/site/production.conf) as the only live-specific input.
  #
  # Neither publishes a port. Host nginx reaches api-gateway at its address on
  # the `gateway` network, which is `internal` (no route off the host), and
  # gateway-auth is reachable from that network alone. The api keeps its
  # published 127.0.0.1:8000 until Phase 10.7.
  #
  # Rollback: scripts/linux/gateway_edge_switch.sh rollback (root) puts host
  # nginx back on :8000 — these services can keep running, nothing reaches them.
  # Runbook: docs/architecture/phase10/PHASE10_5_CUTOVER.md.
  gateway-auth:
    build:
      context: .
      dockerfile: gateway/token_check/Dockerfile
    image: ccure-gateway-auth:10.5
    container_name: ccure-gateway-auth
    logging: *default-logging
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      - TZ=Asia/Kolkata
      # Must equal the core's tokens.ISSUER / USER_AUDIENCE (config.py); the
      # checker holds public keys only, fetched from the core's JWKS.
      - CCURE_TOKEN_ISSUER=https://ccurepro.cdac.in
      - CCURE_TOKEN_USER_AUDIENCE=urn:ccure:api
      - CCURE_JWKS_URL=http://172.31.254.20:8000/auth/jwks.json
    depends_on:
      - api
    networks:
      gateway:
        ipv4_address: 172.31.254.11

  api-gateway:
    image: nginx@sha256:985220252f3863977e468f611ef118ebd01421289dd86ee1ae99cb068c3bce2b
    container_name: ccure-api-gateway
    logging: *default-logging
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /run:uid=101,gid=101,mode=0755
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /tmp
    environment:
      - TZ=Asia/Kolkata
      # The api's own CORS list, rendered into the gateway's refusal headers at
      # start (gateway/nginx/entrypoint), so a refusal carries exactly the
      # Access-Control-Allow-Origin the application's own would.
      - CCURE_CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000}
    volumes:
      - ./gateway/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/nginx/proxy_api.conf:/etc/nginx/ccure/proxy_api.conf:ro
      - ./gateway/policy/route_policy.map:/etc/nginx/ccure/route_policy.map:ro
      - ./gateway/nginx/site/production.conf:/etc/nginx/ccure/site.conf:ro
      - ./gateway/nginx/entrypoint/40-ccure-cors-origins.sh:/docker-entrypoint.d/40-ccure-cors-origins.sh:ro
    depends_on:
      - gateway-auth
    networks:
      gateway:
        ipv4_address: 172.31.254.10

  # ── Malware scanning for uploaded evidence ─────────────────────────────────
  #
  # Compliance evidence is stored on disk and handed back to other people in
  # the tenant, which makes the audit workspace a file-sharing surface whether
  # or not it was designed as one. core/upload_guard.py talks clamd's INSTREAM
  # protocol directly over a socket, so no Python dependency is involved.
  #
  # Behind the `av` profile because it is a real cost, not because it is
  # optional in principle: the image carries a signature database, freshclam
  # pulls updates on a schedule, and clamd wants ~2 GB of RAM to hold the
  # signatures resident. A deployment that cannot spare that should know it is
  # running without the scan rather than discover it.
  #
  #   docker compose --profile av up -d clamav
  #
  # Then set CLAMAV_HOST=clamav in Backend/.env. Until that variable is set the
  # API does not attempt a scan and reports `malware_scan: not_configured` on
  # every upload — an honest "nobody looked", never a silent clean verdict.
  #
  # Leave UPLOAD_AV_REQUIRED at its default False until the container is
  # confirmed healthy. An unreachable scanner then logs loudly and lets the
  # upload through; flip it to True to fail closed once clamd is dependable.
  # A positive detection refuses the upload in both modes.
  #
  # No ports are published. Only the API talks to it, over the compose network.
  clamav:
    image: clamav/clamav:stable
    container_name: ccure-clamav
    logging: *default-logging
    restart: unless-stopped
    profiles: ["av"]
    volumes:
      - clamav_db:/var/lib/clamav
    environment:
      - TZ=Asia/Kolkata
    healthcheck:
      # clamd answers PING with PONG once the signature database is loaded,
      # which takes a couple of minutes on a cold start.
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ── Portainer ────────────────────────────────────────────────────────────
  # Container logs and state from a browser on the workstation. It holds the
  # Docker socket, which is root on this VM, so it is published on loopback
  # only and reached through the same restricted SSH tunnel key as PostgreSQL
  # (`ssh -N ccure-vm` on the workstation, then https://127.0.0.1:9443). It
  # was started by hand on 15 Sep 2026 and brought under this file two days
  # later; `portainer_data` is that original volume, hence `external`, and
  # holds the admin user and the self-signed certificate.
  #
  # First start requires an admin user within 5 minutes and the setup token
  # from `docker logs portainer`; miss it and the instance locks until it is
  # restarted. That is what "cannot access Portainer" was.
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

networks:
  # Phase 10.5: host nginx → api-gateway → gateway-auth / api. `internal`: no
  # route off the host and no port publishing, so gateway-auth and the gateway
  # have no egress and no listener beyond this bridge. The host itself is on
  # the bridge (172.31.254.1) and is how host nginx reaches the gateway.
  # Addresses are pinned (gateway/nginx/site/production.conf, TRUSTED_PROXIES)
  # and gateway/production/tests asserts they agree. 172.31.254.0/24 was
  # checked against the host's routes and every Docker network on 30 Sep 2026.
  gateway:
    internal: true
    ipam:
      config:
        - subnet: 172.31.254.0/24
          gateway: 172.31.254.1

volumes:
  # `pgdata` (the PostgreSQL 15 cluster this deployment started on) was kept
  # here for rollback until 17 Sep 2026 and removed once the 18 migration had
  # a verified full dump behind it.
  pgdata18:
  portainer_data:
    external: true
  backend_venv:
  beat_state:
  clamav_db:
