server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ── Security Headers ───────────────────────────────────────────────────────
  # Prevent the browser from inferring a different MIME type than the server declares.
  add_header X-Content-Type-Options "nosniff" always;

  # Disallow framing from any origin (clickjacking protection).
  add_header X-Frame-Options "DENY" always;

  # Force HTTPS for 1 year once the user has visited over HTTPS.
  # (Remove or shorten if you are still testing over HTTP.)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Do not send the Referer header to cross-origin destinations.
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Restrict browser features that are not needed by this SPA.
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # Content-Security-Policy
  # - default-src 'self'              : only load resources from own origin by default
  # - script-src 'self'               : no inline scripts, no eval
  # - style-src 'self' 'unsafe-inline': Vite injects a small amount of critical CSS at runtime;
  #                                     tighten to 'self' only once a nonce/hash approach is added
  # - connect-src 'self' ws: wss:     : allow WebSocket progress stream and API proxy
  # - img-src 'self' data:            : allow base64-encoded images (avatars, etc.)
  # - font-src 'self'                 : no CDN fonts; all fonts are self-hosted
  # - object-src 'none'               : block Flash and other legacy plugins
  # - base-uri 'self'                 : prevent base-tag injection attacks
  # - frame-ancestors 'none'          : belt-and-suspenders clickjacking protection
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

  # ── SPA routing ───────────────────────────────────────────────────────────
  location / {
    try_files $uri /index.html;
  }

  # ── API Proxy ─────────────────────────────────────────────────────────────
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;

  # Required for WebSocket (scan progress) and SSE (notifications stream)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE needs these — prevents nginx from buffering the event stream
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;

    # CORS is answered by the API's own CORSMiddleware, which checks the request
    # origin against CORS_ALLOW_ORIGINS.
    #
    # This location used to add `Access-Control-Allow-Origin: *` and
    # `Access-Control-Allow-Private-Network: true` unconditionally. The wildcard
    # told every site on the internet it could read responses from this API, and
    # it did so from a hop the application could not see or override — so it
    # survived locking the allow-list down in main.py, on this path. Nginx has no
    # idea which origins are legitimate; the only component that does is the one
    # holding the configuration.
  }

  # ── Static assets — long-lived cache (Vite uses content-hashed filenames) ─
  location ~* ^/assets/.+\.(?:js|css|map|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    # Re-declare security headers inside nested location blocks
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  error_page 404 /index.html;
  location = /index.html {
    internal;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";

    # ── Every security header is repeated here, and must be ──────────────────
    #
    # nginx's add_header does not merge with inherited directives: a location
    # containing any add_header of its own replaces the parent's entire set.
    # `location /` resolves through `try_files $uri /index.html`, so the HTML
    # document is served by *this* block — which meant the Cache-Control line
    # above silently discarded the Content-Security-Policy, X-Frame-Options,
    # nosniff, Referrer-Policy and Permissions-Policy declared at server level.
    #
    # The result was a CSP that existed in the config, read correctly in review,
    # and was absent from the only response it protects. Verified with:
    #   curl -sD - -o /dev/null http://127.0.0.1:3200/ | grep -i content-security
    #
    # If you add a header at server level, add it here too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
  }
}
