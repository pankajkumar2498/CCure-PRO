name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: ccure_user
      PGPASSWORD: ccure_admin_2026
      PGDATABASE: ccure_test
      DATABASE_URL: postgresql://ccure_user:ccure_admin_2026@localhost:5432/ccure_test
      VULNERABILITY_INTEL_DATABASE_URL: postgresql://ccure_user:ccure_admin_2026@localhost:5432/ccure_test
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      JWT_SECRET_KEY: test_secret_key_32_chars_minimum_value

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ccure_test
          POSTGRES_USER: ccure_user
          POSTGRES_PASSWORD: ccure_admin_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt
          pip install "pytest==7.4.4" pytest-cov pytest-rerunfailures bandit ruff

      - name: Run Static Security Analysis (Bandit)
        run: |
          bandit -r Backend/ -x Backend/tests -ll --skip B324,B501,B507,B110,B112,B605,B608,B104,B105,B106

      - name: Run Linting Checks (Ruff)
        run: |
          ruff check Backend/ --ignore=E402,F401,F841,E711,E712,E741,F601,E722,F821

      - name: Verify Database Connection & Create Admin and Root Roles
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=ccure_admin_2026 psql -h localhost -U ccure_user -d ccure_test -c "SELECT version();"
          PGPASSWORD=ccure_admin_2026 psql -h localhost -U ccure_user -d ccure_test -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'admin') THEN CREATE ROLE admin WITH LOGIN PASSWORD 'ccure_admin_2026' SUPERUSER CREATEDB CREATEROLE; END IF; IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'root') THEN CREATE ROLE root WITH LOGIN PASSWORD 'ccure_admin_2026' SUPERUSER CREATEDB CREATEROLE; END IF; END\$\$;" || true

      - name: Bootstrap Database Schema & Seeding Validation
        run: |
          cd Backend
          python db/migrate_production_schema.py
          python -m scripts.seed_compliance
          python -m scripts.seed_real_rules

      - name: Run Alembic Migration Integrity Check
        run: |
          cd Backend
          # Run rollback check on the latest migration
          alembic downgrade -1
          # Re-apply the migration to return to head
          alembic upgrade head

      - name: OpenAPI Schema Diff Check
        run: |
          cd Backend
          # Extract current schema deterministically
          python - <<'PY' > openapi_new.json
          import json
          from main import app

          print(json.dumps(app.openapi(), sort_keys=True, indent=2, ensure_ascii=False))
          PY
          # Check against baseline schema if it exists
          if [ -f "openapi.json" ]; then
            echo "Comparing current schema to tracked baseline..."
            diff -u openapi.json openapi_new.json || (echo "Error: Breaking OpenAPI changes detected!" && exit 1)
          else
            echo "No baseline openapi.json found. Saving current schema as baseline for local checks."
            cp openapi_new.json openapi.json
          fi

      - name: Run Test Suite (with mock profile fallbacks)
        env:
          MOCK_SCANNERS: "true"
        run: |
          cd Backend
          pytest --cov=. --cov-report=xml -v --reruns 1

  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd Frontend
          npm ci

      - name: Run Vulnerability Audit (NPM Audit)
        run: |
          cd Frontend
          npm audit --audit-level=high || echo "NPM audit flagged high/critical vulnerabilities"

      - name: Run Code Formatting and Linting Checks
        run: |
          cd Frontend
          npm run lint || echo "Lint warnings found"
