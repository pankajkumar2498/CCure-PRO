# Site settings for the TRUST HARNESS only (gateway/production/trust_harness/).
# Mounted as /etc/nginx/ccure/site.conf. The upstreams are the harness's stub;
# the trust boundary is the PRODUCTION file, gateway/nginx/trust/unix_edge.conf,
# mounted unchanged at the same path the live gateway reads it from.
upstream ccure_api {
    server stub-api:8000;
}
upstream ccure_gateway_auth {
    server stub-api:8000;
}

include /etc/nginx/ccure/edge_trust.conf;
