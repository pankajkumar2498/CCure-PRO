# Site settings for the LOCAL HARNESS only (gateway/harness/). Mounted as
# /etc/nginx/ccure/site.conf. Production gets its own file in Phase 10.3,
# with the real edge address; nothing here is used by the live stack.

upstream ccure_api {
    server stub-api:8000;
}
upstream ccure_gateway_auth {
    server gateway-auth:8080;
}

# ── trust boundary ───────────────────────────────────────────────────────────
# Exactly one peer may assert the client address and scheme: the edge (host
# nginx in production; the test runner, 10.254.10.10, plays it here). Any other
# peer's X-Real-IP / X-Forwarded-For / X-Forwarded-Proto is ignored, and the
# gateway forwards the peer's own address instead (proxy_api.conf SETS both
# headers, never appends). No range is trusted — this replaces, on the gateway
# hop, the "forwarded-allow-ips='*'" behaviour recorded as finding F10-1.
set_real_ip_from 10.254.10.10;

geo $realip_remote_addr $ccure_from_edge {
    default       0;
    10.254.10.10  1;
}
