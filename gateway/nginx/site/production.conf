# Site settings for the LIVE gateway (docker-compose.yml service `api-gateway`).
# Mounted as /etc/nginx/ccure/site.conf.
#
# Upstreams are static assignments on the compose network `gateway`
# (docker-compose.yml, 172.31.254.0/24, internal: no route off the host):
#
#   172.31.254.10  api-gateway (this nginx; its TCP :8080 trusts nobody)
#   172.31.254.11  gateway-auth
#   172.31.254.20  api
#
# Literal addresses rather than service names: nginx resolves an upstream name
# once, at start, and refuses to start if it cannot — so a gateway restarted
# while the api is being recreated would stay down. The addresses are fixed by
# the network's IPAM, and gateway/production/tests pins them to the compose
# file so the two cannot drift.
#
# host nginx reaches this gateway over a unix socket (Phase 10.6), and the trust
# boundary is that socket: trust/unix_edge.conf, mounted beside this file. In
# 10.5 it was the bridge address 172.31.254.1, which every host process shares.

upstream ccure_api {
    server 172.31.254.20:8000;
}
upstream ccure_gateway_auth {
    server 172.31.254.11:8080;
}

include /etc/nginx/ccure/edge_trust.conf;
