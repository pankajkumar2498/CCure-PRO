# ──────────────────────────────────────────────────────────────────────────────
# CCure — ISOLATED TLS TEST EDGE for the Phase 10 gateway (Phase 10.4).
# ──────────────────────────────────────────────────────────────────────────────
# NOT production. It stands in for host nginx in front of the gateway so the
# whole HTTPS path can be validated without touching the live host nginx
# (/etc/nginx/conf.d/ccure.conf), :443 or :8000. Runs only in the alongside
# stack (gateway/alongside/), published on 127.0.0.1:8443 and nowhere else.
#
# What it copies from the live host nginx /api/ locations, deliberately:
#   * TLS: TLSv1.2 + TLSv1.3, the same ECDHE-only suites, session tickets off;
#   * the header set: nosniff / DENY / strict-origin-when-cross-origin at
#     server level, and in each /api/ location HSTS max-age=300 and nosniff
#     re-added with proxy_hide_header, so each is emitted exactly once;
#   * forwarding: X-Real-IP and X-Forwarded-For SET to $remote_addr (never
#     appended), X-Forwarded-Proto $scheme, Host $host;
#   * WebSocket upgrade, proxy_buffering off, 3600 s read/send timeouts,
#     client_max_body_size 50m.
# What differs, and why:
#   * upstream: the gateway, with the /api prefix kept (the gateway strips it) —
#     the shape Phase 10.5 would give host nginx;
#   * no limit_req / limit_conn zones: those are host nginx's own edge layer and
#     unchanged by the gateway; here they would answer 429 before the
#     application's per-client limits the tests are about;
#   * the access log carries no query string (the live host log still does —
#     decision O14, still open);
#   * the certificate: a throwaway CA and leaf generated for each run, mounted
#     read-only from outside the repository, never a production key.
# ──────────────────────────────────────────────────────────────────────────────

map $http_upgrade $edge_connection_upgrade {
    default  upgrade;
    ""       close;
}

log_format edge_redacted escape=json
    '{"time":"$time_iso8601","client":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
    '"ssl":"$ssl_protocol"}';

ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache         shared:EDGE_SSL:1m;
ssl_session_timeout       1d;
ssl_session_tickets       off;

server {
    listen 8443 ssl;
    http2  on;
    server_name ccurepro.cdac.in localhost;
    server_tokens off;

    ssl_certificate     /etc/nginx/edge-tls/server.pem;
    ssl_certificate_key /etc/nginx/edge-tls/server.key;

    access_log /dev/stdout edge_redacted;
    error_log  /dev/stderr crit;
    client_max_body_size 50m;

    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=300" always;

    location /api/auth/ {
        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=300" always;
        proxy_hide_header X-Content-Type-Options;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;

        proxy_buffering off;
        proxy_cache     off;
    }

    location /api/ {
        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=300" always;
        proxy_hide_header X-Content-Type-Options;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $edge_connection_upgrade;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The gateway fronts /api/ only; host nginx serves the SPA.
    location / {
        return 404;
    }
}
