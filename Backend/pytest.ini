[pytest]
python_files = test_*.py

# Collection is scoped to tests/ deliberately. Without it, a bare `pytest` —
# which is exactly what CI runs — walks the whole Backend tree and collects any
# file matching python_files, wherever it lives. Two things went wrong that way:
#
#   * db/test_data/test-db/test_login.py was collected on every CI run. It POSTs
#     to a live localhost:8000, catches ConnectionError and returns, so it
#     passed unconditionally in an environment with no API server.
#   * Anything collected outside tests/ never loads tests/conftest.py, so the
#     three database-disposability guards that keep the suite off ccure_test do
#     not apply to it.
#
# Utility and verification scripts belong in scripts/verification/ and must not
# be named test_*.py; this line makes that separation enforceable rather than
# a convention people remember.
testpaths = tests

addopts = --ignore=test_output.txt
