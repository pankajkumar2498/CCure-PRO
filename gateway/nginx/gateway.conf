# ──────────────────────────────────────────────────────────────────────────────
# CCure API Gateway — nginx + auth_request to gateway-auth (Phase 10.2d)
# ──────────────────────────────────────────────────────────────────────────────
# Loaded in nginx's http{} context (mounted as conf.d/default.conf). Design:
# docs/architecture/phase10/PHASE10_2_DESIGN.md §§3–11. Owner decisions:
# X2-a (no WWW-Authenticate), X6-a (unrouted requests reach the application
# unauthenticated, so its own 404/405/307 is what the client sees).
#
# Files it reads, all under /etc/nginx/ccure/ unless noted:
#   route_policy.map   GENERATED from the live route table (5cd89c3) — the only
#                      source of which route needs which credential.
#   proxy_api.conf     the proxy settings every forwarding location shares.
#   site.conf          per-environment: the two upstreams and the trust
#                      boundary (which peer may assert the client address).
#   /run/ccure/cors_origins.map
#                      rendered at start from CCURE_CORS_ALLOW_ORIGINS, the
#                      same value the core reads (docker-entrypoint.d script).
#
# Flow for /api/<path>:
#   1. The request is classified by the generated map. public / options /
#      unrouted → policy "none" → @ccure_noauth: forwarded with no check, so
#      sign-in keeps working while gateway-auth is down and the application
#      answers unrouted requests itself (X6-a).
#   2. Otherwise auth_request asks gateway-auth. 204 → forwarded with the
#      verified principal; 401/403 + X-Ccure-Refusal → @ccure_refuse renders
#      the application's own response for that code; no answer → 503.
#   3. The application's own responses, error statuses included, are passed
#      through untouched (proxy_intercept_errors is off): error_page below only
#      ever sees statuses this gateway generated.
# ──────────────────────────────────────────────────────────────────────────────

# ── request classification ───────────────────────────────────────────────────
# Starlette routes a WebSocket handshake separately from HTTP; so does the map.
map $http_upgrade $ccure_scope {
    ~*^websocket$  websocket;
    default        http;
}
map $http_upgrade $ccure_connection_upgrade {
    default  upgrade;
    ""       close;
}
# The application path: the request path without /api, as the core sees it.
map $uri $ccure_app_path {
    ~^/api(?<ccure_rest>/.*)$  $ccure_rest;
    default                    $uri;
}

include /etc/nginx/ccure/route_policy.map;
include /etc/nginx/ccure/site.conf;
include /run/ccure/cors_origins.map;

# X-Forwarded-Proto is believed only from the trusted edge (site.conf).
map $ccure_from_edge $ccure_forwarded_proto {
    1        $http_x_forwarded_proto;
    default  $scheme;
}

# ── refusals: the application's own responses, as characterised (10.1) ──────
# tests/test_config_static.py pins each message to gateway/token_check
# REFUSALS, so the checker's codes and these bodies cannot drift apart.
# request_id is null: the gateway invents no id, and sends no X-Request-ID.
map $ccure_refusal $ccure_refusal_body {
    default            "";
    missing_bearer     '{"success":false,"error_code":"HTTP_403","message":"Not authenticated","detail":"Not authenticated","request_id":null}';
    non_bearer_scheme  '{"success":false,"error_code":"HTTP_403","message":"Invalid authentication credentials","detail":"Invalid authentication credentials","request_id":null}';
    invalid_bearer     '{"success":false,"error_code":"HTTP_401","message":"Invalid or expired token","detail":"Invalid or expired token","request_id":null}';
    missing_flexible   '{"success":false,"error_code":"HTTP_401","message":"Authentication token is missing.","detail":"Authentication token is missing.","request_id":null}';
    invalid_ticket     '{"success":false,"error_code":"HTTP_401","message":"Invalid or expired download ticket.","detail":"Invalid or expired download ticket.","request_id":null}';
}
# Retry-After on the gateway's own 503 only. add_header applies to a whole
# location wherever it is written, so the value comes from the status; an
# empty value emits nothing (the technique host nginx uses for its 429s).
map $status $ccure_retry_after {
    503      5;
    default  "";
}
# CORS on a refusal, as the application's CORSMiddleware answers one: the
# credentials flag whenever an Origin is present, the origin only if allowed.
map $http_origin $ccure_cors_credentials {
    ""       "";
    default  true;
}
map $ccure_cors_allow_origin $ccure_cors_vary {
    ""       "";
    default  Origin;
}

# ── logging: never the query, a credential, a cookie or the Referer ─────────
# $ccure_uri_checked is $uri (decoded path, no query string) captured before
# the /api prefix is rewritten away.
log_format ccure_gw escape=json
    '{"time":"$time_iso8601","peer":"$realip_remote_addr","client":"$remote_addr",'
    '"method":"$request_method","uri":"$ccure_uri_checked","status":$status,'
    '"bytes":$body_bytes_sent,"rt":$request_time,"upstream":"$upstream_status",'
    '"class":"$ccure_class_checked","policy":"$ccure_policy_checked",'
    '"refusal":"$ccure_refusal","sub":"$ccure_auth_sub","jti":"$ccure_auth_jti"}';

server {
    listen 8080;
    # Per-deployment listeners (Phase 10.6: the live edge's unix socket,
    # listen/unix_edge.conf). A glob that matches nothing is not an error, so
    # the harness and the alongside stack, which mount none, are unchanged.
    include /etc/nginx/ccure/listen.d/*.conf;
    server_tokens off;

    access_log /dev/stdout ccure_gw;
    # nginx's error log writes the full request line, query included, on
    # upstream errors — the leak nobody configures (design R2). Only crit.
    error_log /dev/stderr crit;

    client_max_body_size 50m;
    recursive_error_pages on;
    real_ip_header X-Real-IP;
    real_ip_recursive off;

    # Nothing is ever buffered to disk (proxy_api.conf); these paths exist so
    # a harness can mount them read-only and prove it.
    proxy_temp_path       /var/cache/nginx/ccure_proxy_temp;
    client_body_temp_path /var/cache/nginx/ccure_body_temp;

    # Filled by auth_request_set only; empty everywhere else. (Server-level
    # `set` runs again inside the auth subrequest, so nothing that must
    # survive the subrequest is captured here — see location /api/.)
    set $ccure_refusal        "";
    set $ccure_auth_status    "";
    set $ccure_auth_sub       "";
    set $ccure_auth_jti       "";
    set $ccure_auth_ptype     "";
    set $ccure_auth_kind      "";
    set $ccure_empty          "";

    location /api/ {
        # Captured once, from the request as received, before the /api prefix
        # is rewritten away. Here and not at server level: the auth subrequest
        # re-runs server-level `set` with its own (empty) $args and its own $uri.
        set $ccure_uri_checked    $uri;
        set $ccure_policy_checked $ccure_policy;
        set $ccure_class_checked  $ccure_route_class;
        set $ccure_method_checked $request_method;
        set $ccure_args_checked   $args;

        error_page 418 = @ccure_noauth;
        if ($ccure_policy_checked = none) {
            return 418;
        }

        auth_request     /_ccure_auth;
        auth_request_set $ccure_auth_status $upstream_status;
        auth_request_set $ccure_refusal     $upstream_http_x_ccure_refusal;
        auth_request_set $ccure_auth_sub    $upstream_http_x_ccure_auth_sub;
        auth_request_set $ccure_auth_jti    $upstream_http_x_ccure_auth_jti;
        auth_request_set $ccure_auth_ptype  $upstream_http_x_ccure_auth_ptype;
        auth_request_set $ccure_auth_kind   $upstream_http_x_ccure_auth_kind;
        error_page 401 403 = @ccure_refuse;
        error_page 500     = @ccure_auth_unavailable;

        include /etc/nginx/ccure/proxy_api.conf;
    }

    # The subrequest to gateway-auth: headers only. The client's Authorization
    # passes through; everything gateway-auth reads besides it is set here, so
    # a client cannot supply its own policy, method or query.
    location = /_ccure_auth {
        internal;
        proxy_pass              http://ccure_gateway_auth/check;
        proxy_pass_request_body off;
        proxy_http_version      1.1;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie         "";
        proxy_set_header Upgrade        "";
        proxy_set_header Connection     "";
        proxy_set_header X-Ccure-Policy $ccure_policy_checked;
        proxy_set_header X-Ccure-Method $ccure_method_checked;
        proxy_set_header X-Ccure-Args   $ccure_args_checked;
        proxy_connect_timeout 1s;
        proxy_send_timeout    2s;
        proxy_read_timeout    2s;
    }

    # public, options and unrouted: forwarded with no credential check.
    location @ccure_noauth {
        include /etc/nginx/ccure/proxy_api.conf;
    }

    # gateway-auth refused: the application's own status and body for the code.
    location @ccure_refuse {
        error_page 418 = @ccure_ws_refuse;
        if ($ccure_refusal = ws_refused) {
            return 418;
        }
        default_type application/json;
        add_header X-Content-Type-Options           "nosniff" always;
        add_header X-Frame-Options                  "DENY" always;
        add_header Referrer-Policy                  "no-referrer" always;
        add_header Content-Security-Policy          "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header Cross-Origin-Resource-Policy     "same-site" always;
        add_header Access-Control-Allow-Origin      $ccure_cors_allow_origin always;
        add_header Access-Control-Allow-Credentials $ccure_cors_credentials always;
        add_header Vary                             $ccure_cors_vary always;
        if ($ccure_refusal = missing_bearer)    { return 403 $ccure_refusal_body; }
        if ($ccure_refusal = non_bearer_scheme) { return 403 $ccure_refusal_body; }
        if ($ccure_refusal = invalid_bearer)    { return 401 $ccure_refusal_body; }
        if ($ccure_refusal = missing_flexible)  { return 401 $ccure_refusal_body; }
        if ($ccure_refusal = invalid_ticket)    { return 401 $ccure_refusal_body; }
        add_header Retry-After                      $ccure_retry_after always;
        # A refusal code this gateway does not know: fail closed.
        return 503 '{"success":false,"error_code":"AUTH_UNAVAILABLE","message":"Authentication is temporarily unavailable.","detail":"Authentication is temporarily unavailable.","request_id":null}';
    }

    # A refused WebSocket upgrade is a bare 403, as the application sends it.
    # The body is an empty *variable*: a literal "" makes nginx fall back to
    # its HTML error page.
    location @ccure_ws_refuse {
        default_type text/plain;
        return 403 $ccure_empty;
    }

    # gateway-auth did not answer usefully (down, timed out, 5xx, 503 while it
    # has no key set): nothing is forwarded. nginx runs auth_request_set on
    # every outcome, so $ccure_auth_status holds the checker's status (or 502
    # when it was unreachable). Only a 2xx means authentication succeeded and
    # this 500 came from somewhere else; that one is left as nginx's own 500.
    location @ccure_auth_unavailable {
        if ($ccure_auth_status ~ "^2") {
            return 500;
        }
        default_type application/json;
        add_header X-Content-Type-Options           "nosniff" always;
        add_header X-Frame-Options                  "DENY" always;
        add_header Referrer-Policy                  "no-referrer" always;
        add_header Content-Security-Policy          "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header Cross-Origin-Resource-Policy     "same-site" always;
        add_header Access-Control-Allow-Origin      $ccure_cors_allow_origin always;
        add_header Access-Control-Allow-Credentials $ccure_cors_credentials always;
        add_header Vary                             $ccure_cors_vary always;
        add_header Retry-After                      $ccure_retry_after always;
        return 503 '{"success":false,"error_code":"AUTH_UNAVAILABLE","message":"Authentication is temporarily unavailable.","detail":"Authentication is temporarily unavailable.","request_id":null}';
    }

    # The gateway fronts /api/ only; host nginx serves the SPA.
    location / {
        set $ccure_uri_checked    $uri;
        set $ccure_policy_checked "";
        set $ccure_class_checked  "";
        return 404;
    }
}
