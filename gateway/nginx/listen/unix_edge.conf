# The edge's listener (Phase 10.6). Included into gateway.conf's server block
# from /etc/nginx/ccure/listen.d/, so only a deployment that mounts it has it.
#
# host nginx reaches the gateway through this unix socket, and ONLY a peer on
# it may assert the client address and scheme (trust/unix_edge.conf). Who can
# connect is decided by the filesystem, not by nginx: nginx creates the socket
# mode 0666, and the directory holding it is root:www-data 0770 on the host,
# so host nginx (www-data) and root can reach it and no other host account can.
listen unix:/run/ccure-edge/gateway.sock;
