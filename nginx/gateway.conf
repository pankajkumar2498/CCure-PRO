# ──────────────────────────────────────────────────────────────────────────────
# CCure Audit PRO — Nginx Gateway (Reverse Proxy)
# ──────────────────────────────────────────────────────────────────────────────
# Single entry point for the entire application.
# Captures the real client IP and forwards it to backend services via
# X-Forwarded-For / X-Real-IP headers, enabling accurate audit logging.
#
# Architecture:
#   Client → Gateway (:80) ─┬─ /api/*  → api:8000  (backend API)
#                            └─ /*      → frontend:80 (SPA + static)
# ──────────────────────────────────────────────────────────────────────────────

# Shared map: determine whether to set Connection header for WebSocket upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ── Client body size (file uploads, scan payloads) ───────────────────────
    client_max_body_size 50m;

    # ── API Proxy ────────────────────────────────────────────────────────────
    # Strips the /api prefix: /api/auth/login → api:8000/auth/login
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;

        # ── Real client IP forwarding (the whole point of this gateway) ──────
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;

        # ── WebSocket support (scan progress streams) ────────────────────────
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ── SSE / streaming support (notifications, long-running responses) ──
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Frontend SPA ─────────────────────────────────────────────────────────
    # Everything else goes to the frontend Nginx container
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
