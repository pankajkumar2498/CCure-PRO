# ──────────────────────────────────────────────────────────────────────────────
# CCure gateway — ALONGSIDE validation with the REAL application (Phase 10.3).
# ──────────────────────────────────────────────────────────────────────────────
# Its own project, network, database, Redis and throwaway token keyset. It runs
# the real backend image with a scratch copy of the working tree's Backend/
# (never Backend/.env), the committed gateway and gateway-auth, and touches
# nothing live: not the live database, keys, credentials, network, host nginx,
# or :8000. Published ports are bound to 127.0.0.1 only. Run it with run.sh.
#
#   edge (the host)  ──127.0.0.1:8082──▶ gateway ──▶ gateway-auth
#                                           │
#                                           └──────▶ api          (trusts the gateway only)
#   127.0.0.1:18000 ─────────────────────────────────▶ api          (direct, for comparison)
#   127.0.0.1:18001 ─────────────────────────────────▶ api-edge     (production's trust today)
#   insider (10.254.20.50) — an untrusted container on the network
#
# api      = the TARGET trust boundary: only the gateway (10.254.20.10) may
#            assert a client address or scheme.
# api-edge = the PRODUCTION boundary as committed for today's path: only the
#            docker-proxy peer (10.254.20.1 here; 172.18.0.1 on the live
#            network) — i.e. host nginx — may.
# ──────────────────────────────────────────────────────────────────────────────

name: ccure-gw-alongside

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

x-api-env: &api-env
  TZ: Asia/Kolkata
  APP_ENV: production
  RELOAD: "false"
  DATABASE_URL: "postgresql://ccure_user:${ALONGSIDE_DB_PASSWORD:?run via run.sh}@db:5432/ccure_alongside?sslmode=disable"
  VULN_DB_HOST: db
  VULN_DB_PORT: "5432"
  VULN_DB_NAME: ccure_alongside
  VULN_DB_USER: ccure_user
  VULN_DB_PASSWORD: "${ALONGSIDE_DB_PASSWORD:?run via run.sh}"
  PGSSLMODE: disable
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CELERY_TASK_ALWAYS_EAGER: "false"
  JWT_SECRET_KEY: "${ALONGSIDE_JWT_SECRET:?run via run.sh}"
  MFA_ENCRYPTION_KEY: "${ALONGSIDE_MFA_KEY:?run via run.sh}"
  COMPLIANCE_ENCRYPTION_KEY: "${ALONGSIDE_COMPLIANCE_KEY:?run via run.sh}"
  CCURE_TOKEN_KEYS_DIR: /keys
  CCURE_TOKEN_SIGNING_ALG: ES256
  CCURE_ACCEPT_LEGACY_HS256: "false"
  REFRESH_COOKIE_PATH: /
  REFRESH_COOKIE_SECURE: "True"
  REFRESH_COOKIE_SAMESITE: lax
  ALLOW_SELF_REGISTRATION: "True"
  EMAIL_DOMAIN_GUARD_MODE: "off"
  FRONTEND_URL: https://ccurepro.cdac.in
  CORS_ALLOW_ORIGINS: "https://ccurepro.cdac.in,https://10.180.22.127,https://localhost,http://localhost:3200,http://127.0.0.1:3200,http://localhost:8000,http://127.0.0.1:8000"
  SMTP_HOST: ""

networks:
  alongside:
    driver: bridge
    ipam:
      config:
        - subnet: 10.254.20.0/24
          gateway: 10.254.20.1

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ccure_user
      POSTGRES_PASSWORD: "${ALONGSIDE_DB_PASSWORD:?run via run.sh}"
      POSTGRES_DB: ccure_alongside
    tmpfs: [/var/lib/postgresql]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccure_user -d ccure_alongside"]
      interval: 3s
      retries: 40
    networks:
      alongside:
        ipv4_address: 10.254.20.30
    logging: *default-logging

  redis:
    image: redis:7-alpine
    networks:
      alongside:
        ipv4_address: 10.254.20.31
    logging: *default-logging

  api:
    image: ccure-audit-pro-backend:latest
    command: ["sh", "-c", "tr -d '\\r' < /app/start.sh > /tmp/start.sh && chmod +x /tmp/start.sh && /tmp/start.sh"]
    environment:
      <<: *api-env
      TRUSTED_PROXIES: "10.254.20.10"
    volumes:
      - "${ALONGSIDE_WORK:?run via run.sh}/Backend:/app"
      - "${ALONGSIDE_WORK:?run via run.sh}/keys:/keys:ro"
      - ./:/alongside:ro
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 5s
      retries: 60
      start_period: 20s
    ports:
      - "127.0.0.1:18000:8000"
    networks:
      alongside:
        ipv4_address: 10.254.20.20
    logging: *default-logging

  api-edge:
    image: ccure-audit-pro-backend:latest
    # No migration: the schema is api's. Only the server.
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]
    working_dir: /app
    environment:
      <<: *api-env
      TRUSTED_PROXIES: "10.254.20.1"
    volumes:
      - "${ALONGSIDE_WORK:?run via run.sh}/Backend:/app"
      - "${ALONGSIDE_WORK:?run via run.sh}/keys:/keys:ro"
    depends_on:
      api: {condition: service_healthy}
    ports:
      - "127.0.0.1:18001:8000"
    networks:
      alongside:
        ipv4_address: 10.254.20.21
    logging: *default-logging

  gateway-auth:
    build:
      context: ../..
      dockerfile: gateway/token_check/Dockerfile
    image: ccure-gateway-auth:alongside
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      CCURE_TOKEN_ISSUER: "https://ccurepro.cdac.in"
      CCURE_TOKEN_USER_AUDIENCE: "urn:ccure:api"
      CCURE_JWKS_URL: "http://api:8000/auth/jwks.json"
    depends_on:
      api: {condition: service_healthy}
    networks:
      alongside:
        ipv4_address: 10.254.20.11
    logging: *default-logging

  gateway:
    image: nginx@sha256:985220252f3863977e468f611ef118ebd01421289dd86ee1ae99cb068c3bce2b
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /run:uid=101,gid=101,mode=0755
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /tmp
    environment:
      CCURE_CORS_ALLOW_ORIGINS: "https://ccurepro.cdac.in,https://10.180.22.127,https://localhost,http://localhost:3200,http://127.0.0.1:3200,http://localhost:8000,http://127.0.0.1:8000"
    volumes:
      - ../nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/proxy_api.conf:/etc/nginx/ccure/proxy_api.conf:ro
      - ../policy/route_policy.map:/etc/nginx/ccure/route_policy.map:ro
      - ../nginx/site/alongside.conf:/etc/nginx/ccure/site.conf:ro
      - ../nginx/entrypoint/40-ccure-cors-origins.sh:/docker-entrypoint.d/40-ccure-cors-origins.sh:ro
    depends_on:
      gateway-auth: {condition: service_started}
    # Loopback only: never the LAN, never 0.0.0.0.
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      alongside:
        ipv4_address: 10.254.20.10
    logging: *default-logging

  insider:
    image: ccure-audit-pro-backend:latest
    command: ["python", "/alongside/relay.py"]
    read_only: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./:/alongside:ro
    ports:
      - "127.0.0.1:18050:9000"
    networks:
      alongside:
        ipv4_address: 10.254.20.50
    logging: *default-logging

  runner:
    image: ccure-audit-pro-backend:latest
    profiles: ["run"]
    # The host network: the runner reaches the loopback-published ports exactly
    # as host nginx would, so the gateway and api-edge see it as the edge.
    network_mode: host
    working_dir: /gateway/alongside
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /gateway:/gateway/alongside/tests
      ALONGSIDE_USER_PASSWORD: "${ALONGSIDE_USER_PASSWORD:?run via run.sh}"
      ALONGSIDE_OUT: /out
    volumes:
      - ../:/gateway:ro
      - ../../docs:/docs:ro
      - "${ALONGSIDE_WORK:?run via run.sh}/out:/out"
    logging: *default-logging
