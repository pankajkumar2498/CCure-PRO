name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# The branch filter on `push` is deliberate and must stay. Without it, a push
# to a branch with an open PR fires `push` *and* `pull_request` for the same
# commit, and every PR runs the whole pipeline twice in parallel forever.
#
# Two runs per change is still expected and is not that bug: the pull_request
# run tests refs/pull/N/merge — this branch merged into master as master is
# now — while the push run tests the commit that actually landed. They differ
# whenever master moves while a PR is open, which is exactly when a merge
# breaks something neither branch broke alone.

# Nothing in this workflow writes to the repository. The default token grants
# read/write across it to every third-party action in the graph.
permissions:
  contents: read

# One live run per ref. Three quick pushes to a PR used to start three full
# runs, of which only the last could still matter.
#
# Master is exempt on purpose. Cancelling there would leave commits with no
# recorded conclusion, and that status is what branch protection reads and
# what tells you which commit last built cleanly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_NODE_TYPE: node24

jobs:
  backend-validation:
    name: Backend Validation
    # Reset execution must pass in its own disposable service before this
    # required check can pass. It never shares this job's release-test database.
    needs: reset-validation
    runs-on: ubuntu-latest
    # Without a timeout a hung pytest, or a postgres service that never
    # reports healthy, runs to GitHub's 6-hour ceiling before anyone is told.
    # The job took 29 minutes on a hosted runner on 8 Oct 2026, against a
    # 30-minute limit: one slower runner would have cancelled a passing run.
    # 45 is headroom for that, not a target.
    timeout-minutes: 45
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: ccure_user
      PGPASSWORD: ccure_admin_2026
      PGDATABASE: pytest_release_validation
      DATABASE_URL: postgresql://ccure_user:ccure_admin_2026@localhost:5432/pytest_release_validation
      TEST_DATABASE_URL: postgresql://ccure_user:ccure_admin_2026@localhost:5432/pytest_release_validation
      VULNERABILITY_INTEL_DATABASE_URL: postgresql://ccure_user:ccure_admin_2026@localhost:5432/pytest_release_validation
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      MFA_ENCRYPTION_KEY: test_mfa_key_32_chars_minimum_value

    services:
      postgres:
        # The major version must match docker-compose.yml's `db` service.
        # CI stayed on 15 after production moved to 18 (17 Sep 2026), so
        # migrations, constraints and query plans were being proven on a
        # server nobody deploys. Change the two together;
        # tests/repo/test_ci_postgres_version.py fails if they diverge.
        image: postgres:18-alpine
        env:
          POSTGRES_DB: pytest_release_validation
          POSTGRES_USER: ccure_user
          POSTGRES_PASSWORD: ccure_admin_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccure_user -d pytest_release_validation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt
          pip install "pytest==7.4.4" pytest-cov pytest-rerunfailures "bandit==1.9.4" ruff

      # High severity only, and no --skip. It used to skip fourteen rules
      # globally; eleven of them raise nothing at this severity, and the other
      # three (B324 weak hash, B501 TLS verification off, B507 unknown SSH host
      # key) hid seventeen findings the scanner genuinely needs, but also any
      # new one, such as verify=False on an outbound feed fetch. The eight
      # identifier hashes now say `usedforsecurity=False`; the other nine
      # carry a one-line `# nosec`, and four of those are recorded as
      # accepted risks. Keep this identical to .pre-commit-config.yaml and see
      # docs/ci/SECURITY_GATES.md before adding a suppression.
      #
      # Bandit is pinned because a new release adds rules, and an unpinned
      # install turns that into a red build on a commit that changed nothing.
      - name: Run Static Security Analysis (Bandit)
        run: |
          bandit -r Backend/ -x Backend/tests -lll

      - name: Run Linting Checks (Ruff)
        run: |
          ruff check Backend/ --select=E,F,W --ignore=E402,F401,F841,E711,E712,E741,F601,E722,F821,E501

      - name: Verify Database Connection & Create Admin and Root Roles
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=ccure_admin_2026 psql -h localhost -U ccure_user -d pytest_release_validation -c "SELECT version();"
          # No `|| true`. The block is already idempotent (IF NOT EXISTS), and
          # ccure_user owns this throwaway instance, so a failure here means
          # the roles genuinely were not created — which surfaces later as a
          # confusing permission error inside a test rather than here.
          PGPASSWORD=ccure_admin_2026 psql -v ON_ERROR_STOP=1 -h localhost -U ccure_user -d pytest_release_validation -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'admin') THEN CREATE ROLE admin WITH LOGIN PASSWORD 'ccure_admin_2026' SUPERUSER CREATEDB CREATEROLE; END IF; IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'root') THEN CREATE ROLE root WITH LOGIN PASSWORD 'ccure_admin_2026' SUPERUSER CREATEDB CREATEROLE; END IF; END\$\$;"

      - name: Bootstrap Database Schema & Seeding Validation
        run: |
          cd Backend
          python db/migrate_production_schema.py
          python -m scripts.seed_compliance
          python -m scripts.seed_real_rules

      - name: Run Alembic Migration Integrity Check
        run: |
          cd Backend
          # Roll back the newest migration on every branch, then re-apply them.
          # Each core module has its own branch (Phase 11.3), so the history has
          # several heads and a bare `downgrade -1` is ambiguous: step back from
          # each head by name instead.
          #
          # A migration that deliberately cannot be reversed is listed here
          # and skipped, never worked around: its downgrade() raises on
          # purpose, so rolling back from it would fail the build for a
          # reason that is the migration's design, not a regression.
          #   d4f8b2c6e0a1  removes the legacy RBAC tables (4 Oct 2026); the
          #                 data is gone and only a recovery snapshot has it.
          #   f6a8c0e2b4d7  removes retired subscription columns (12 Oct 2026);
          #                 their values require the pre-migration backup.
          # Reversibility is only exercised above such a revision; the
          # forward upgrade below still runs through all of them.
          IRREVERSIBLE_REVISIONS="d4f8b2c6e0a1 f6a8c0e2b4d7"
          for rev in $(alembic heads | awk '{print $1}'); do
            case " ${IRREVERSIBLE_REVISIONS} " in
              *" ${rev} "*)
                echo "Skipping rollback of ${rev}: recorded as irreversible."
                continue
                ;;
            esac
            alembic downgrade "${rev}@-1"
          done
          alembic upgrade heads

      - name: OpenAPI Schema Diff Check
        run: |
          cd Backend
          # Extract current schema deterministically
          python - <<'PY' > openapi_new.json
          import json
          from main import app

          print(json.dumps(app.openapi(), sort_keys=True, indent=2, ensure_ascii=False))
          PY
          # A missing baseline fails. It must not be bootstrapped here: the
          # copy would be written into a runner that is thrown away seconds
          # later, so deleting openapi.json — or forgetting to commit it —
          # made this gate pass unconditionally while still looking like it
          # had run.
          if [ ! -f "openapi.json" ]; then
            echo "::error file=Backend/openapi.json::Missing API contract baseline."
            echo "Backend/openapi.json is tracked and must exist. Regenerate with:"
            echo "  cd Backend && python -c \"import json;from main import app;print(json.dumps(app.openapi(), sort_keys=True, indent=2, ensure_ascii=False))\" > openapi.json"
            exit 1
          fi

          echo "Comparing current schema to tracked baseline..."
          if ! diff -u openapi.json openapi_new.json; then
            echo "::error file=Backend/openapi.json::API schema changed but the tracked contract was not updated."
            echo "The routes above differ from Backend/openapi.json. If the change is"
            echo "intended, regenerate the file and commit it:"
            echo "  cd Backend && python -c \"import json;from main import app;print(json.dumps(app.openapi(), sort_keys=True, indent=2, ensure_ascii=False))\" > openapi.json"
            exit 1
          fi
          echo "OpenAPI schema matches the tracked contract."

      - name: Run Test Suite (with mock profile fallbacks)
        env:
          MOCK_SCANNERS: "true"
        run: |
          cd Backend
          # --reruns keeps a genuinely flaky runner from failing the build.
          # -rR is what makes that honest: without it a test that fails and
          # then passes is recorded as plain green, so the instability is
          # never seen again. With it, every retried test is named in the
          # summary and the job still passes.
          # Only these execution cases move to reset-validation. Head checks,
          # production refusals and all remaining reset guards stay here.
          pytest --cov=. --cov-report=xml -v --reruns 1 -rR \
            --deselect tests/rbac/test_development_reset.py::test_reset_bootstraps_native_administrator_without_touching_catalogues \
            --deselect tests/rbac/test_development_reset.py::test_forward_migration_removes_only_legacy_objects

      # The gateway (Phase 10). gateway-auth decides every API request before
      # the core sees it, and its verification rules are the core's own file
      # (Backend/ccure_platform/identity/verification.py, baked into its
      # image), so a backend change can break the gateway without touching
      # gateway/. Neither suite ran in CI before 9 Oct 2026. These two are the
      # hermetic ones (no network, no Docker, about 10 s together) and run
      # inside this required job, so they block a PR without a ruleset change.
      # The Docker harnesses (refusal matrix, fail-closed, trust boundary) need
      # the backend image and run in gateway.yml. docs/ci/BRANCH_PROTECTION.md.
      - name: Gateway Tests (gateway-auth unit and FastAPI parity)
        env:
          PYTHONPATH: gateway:Backend
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q -p no:cacheprovider gateway/token_check/tests

      - name: Gateway Tests (production configuration, static)
        run: |
          python -m pytest -q -p no:cacheprovider gateway/production/tests

      - name: Verify Documentation Build & Integrity
        run: |
          cd Backend
          python scripts/compile_docs.py
          pytest tests/repo/test_docs_integrity.py -v

  reset-validation:
    name: Disposable Reset Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No deployment environment, secret, self-hosted runner or shared database.
    # These are disposable CI credentials, never production credentials.
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: ccure_user
      PGPASSWORD: ci_reset_test_password
      PGDATABASE: pytest_rbac_reset
      DATABASE_URL: postgresql://ccure_user:ci_reset_test_password@localhost:5432/pytest_rbac_reset
      TEST_DATABASE_URL: postgresql://ccure_user:ci_reset_test_password@localhost:5432/pytest_rbac_reset
      VULNERABILITY_INTEL_DATABASE_URL: postgresql://ccure_user:ci_reset_test_password@localhost:5432/pytest_rbac_reset
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      MFA_ENCRYPTION_KEY: test_mfa_key_32_chars_minimum_value
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: pytest_rbac_reset
          POSTGRES_USER: ci_reset_dba
          POSTGRES_PASSWORD: ci_reset_dba_password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ci_reset_dba -d pytest_rbac_reset"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install reset-test dependencies
        run: |
          python -m pip install -r Backend/requirements.txt
          python -m pip install "pytest==7.4.4"
          sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare disposable schema and restricted application role
        run: |
          PGPASSWORD=ci_reset_dba_password psql -X -v ON_ERROR_STOP=1 -h localhost -U ci_reset_dba -d pytest_rbac_reset <<'SQL'
          CREATE ROLE ccure_user LOGIN PASSWORD 'ci_reset_test_password' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          ALTER DATABASE pytest_rbac_reset OWNER TO ccure_user;
          ALTER SCHEMA public OWNER TO ccure_user;
          SQL
          mkdir -m 700 "$RUNNER_TEMP/reset-backups"
          PGPASSWORD=ci_reset_dba_password pg_dump -U ci_reset_dba -Fc -f "$RUNNER_TEMP/reset-backups/before-bootstrap.dump"
          chmod 600 "$RUNNER_TEMP/reset-backups/before-bootstrap.dump"
          cd Backend
          python db/migrate_production_schema.py
          for bootstrap in bootstrap_chain.sql bootstrap_chain_retention.sql bootstrap_chain_retention_chained.sql; do
            PGPASSWORD=ci_reset_dba_password psql -X -v ON_ERROR_STOP=1 -v app_role=ccure_user \
              -h localhost -U ci_reset_dba -d pytest_rbac_reset -f "scripts/audit/$bootstrap"
          done
          PGPASSWORD=ci_reset_dba_password pg_dump -U ci_reset_dba -Fc -f "$RUNNER_TEMP/reset-backups/before-reset-tests.dump"
          chmod 600 "$RUNNER_TEMP/reset-backups/before-reset-tests.dump"
      - name: Execute only isolated reset and legacy-removal cases
        run: |
          cd Backend
          python -m pytest -q -r a --junitxml="$RUNNER_TEMP/reset-results.xml" \
            tests/rbac/test_development_reset.py::test_reset_bootstraps_native_administrator_without_touching_catalogues \
            tests/rbac/test_development_reset.py::test_forward_migration_removes_only_legacy_objects
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse(os.path.join(os.environ['RUNNER_TEMP'], 'reset-results.xml')).getroot()
          cases = list(root.iter('testcase'))
          assert len(cases) == 2, 'Both reset execution cases must run'
          assert not any(case.find(tag) is not None for case in cases for tag in ('skipped', 'failure', 'error')), 'Skipped reset tests are NOT VERIFIED'
          PY

  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest
    # The browser checks here run in Chromium only (see the browser step). The
    # 75-minute budget was set for all three engines, which took about 15
    # minutes on an 8-core workstation and did not fit 30 on a hosted runner
    # (7 Oct 2026). It is left as it was; lower it once Chromium-only runs
    # show what this job really takes.
    timeout-minutes: 75

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd Frontend
          npm ci

      - name: Verify Approved UX4G Dependency Foundation
        run: |
          cd Frontend
          npm run ux4g:check -- --dependencies-only

      # npm audit lives in security.yml ("npm Dependency Audit"), which also
      # runs it nightly. The step that stood here ended in `|| echo` and could
      # not fail.

      # The build comes before the tests, and both matter. The guardrails
      # suite inspects dist/ to assert the shipped bundle carries no UX4G
      # runtime; without a build it fails on every clean checkout, and until
      # this step existed CI had never verified that the frontend builds at
      # all. `prebuild` generates the UX4G assets from the pinned package, so
      # this step needs no network beyond `npm ci`.
      - name: Build Frontend
        env:
          VITE_API_BASE_URL: /api
        run: |
          cd Frontend
          npm run build

      - name: Verify Reproducible UX4G Assets and Provenance
        run: |
          cd Frontend
          npm run ux4g:verify
          npm run ux4g:check -- --dist

      - name: Run Frontend Tests
        run: |
          cd Frontend
          npm test

      - name: Verify UX4G UI Boundaries and Documentation
        run: |
          cd Frontend
          npm run ux4g:architecture
          node scripts/build-authorization-inventory.mjs --check

      # Chromium on every PR and push: the same accessibility, keyboard,
      # responsive and reflow checks, in one engine. Firefox and WebKit run the
      # identical suite every night in browser-matrix.yml, which is where a
      # cross-engine regression shows up. Three engines here made this the
      # slowest check on every PR and did not finish on a hosted runner.
      - name: Install Pinned Browser Engine (Chromium)
        run: |
          cd Frontend
          npx --no-install playwright install --with-deps chromium

      - name: Check Accessibility, Responsive UI and Browser Contracts (Chromium)
        env:
          UX4G_BROWSER_OUTPUT: ${{ runner.temp }}/ux4g-browser-results
          UX4G_BROWSER_REPORT: ${{ runner.temp }}/ux4g-browser-report.json
        run: |
          cd Frontend
          npm run test:browser -- --project=chromium

      - name: Retain Browser Failure Evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ux4g-browser-evidence
          path: |
            ${{ runner.temp }}/ux4g-browser-results
            ${{ runner.temp }}/ux4g-browser-report.json
          if-no-files-found: ignore
          retention-days: 7

      # No `|| echo` on this step, deliberately.
      #
      # The previous version ran `npm run lint || echo "Lint warnings found"`
      # against a `lint` script that did not exist, with eslint not installed.
      # npm exited non-zero, `|| echo` swallowed it, and the step reported
      # success on every run having linted nothing — while the pre-commit hook
      # was separately skipping every file because it matched `javascript` and
      # not `jsx`. Between them, ESLint had never run on this codebase.
      #
      # It has now. The first real run reported 774 problems; the backlog was
      # cleared to 0 errors, and `--max-warnings=27` in the lint script holds
      # the remaining react-hooks/exhaustive-deps warnings at their current
      # count so new ones fail the build. Rationale is in
      # Frontend/.eslintrc.json.
      #
      # If this step starts failing, that is the gate working. Fix the finding
      # rather than restoring a `|| echo`.
      - name: Run Frontend Lint (ESLint)
        run: |
          cd Frontend
          npm run lint
